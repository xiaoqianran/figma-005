<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card: Wallet • Watch Me Dark</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;display=swap'); body { font-family: 'Montserrat', system-ui, -apple-system, sans-serif; } .card { width: 184px; height: 224px; }</style>
</head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen p-8">
  <div class="max-w-md w-full">
    <div class="flex items-center justify-between mb-6">
      <div><div class="text-white text-xl font-semibold tracking-tighter">Wallet</div><div class="text-zinc-500 text-sm">Watch Me • Dark Theme</div></div>
      <button onclick="copySnippet()" class="px-5 py-2 text-sm font-medium bg-white text-black rounded-3xl hover:bg-zinc-200 active:scale-[0.985] transition-all flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16v-4m4 4v4m4-8v8m4-4v-4m-16 8h16a2 2 0 002-2V6a2 2 0 00-2-2H4a2 2 0 00-2 2v12a2 2 0 002 2" /></svg>Copy HTML</button>
    </div>
    <div class="flex justify-center mb-6">
      <div class="card bg-[#1b1d21] rounded-[12px] overflow-hidden shadow-2xl p-4" style="box-shadow: 0 10px 30px rgba(0,0,0,0.45);">
        <div class="text-center"><div class="text-xs text-white/60">All cards</div><div class="text-[#808389] text-sm mt-0.5 font-medium">$ 12 051</div></div>
        <div class="mt-5 px-1 space-y-1">
          <!-- Top full card -->
          <div class="h-14 bg-white rounded-[10px] p-2.5 text-[#1b1d21]">
            <div class="flex items-center gap-1">
              <div class="w-6 h-2 bg-black rounded"></div>
              <div class="w-2.5 h-2 rounded" style="background:#7640ef"></div>
            </div>
            <div class="mt-1 text-[10px] font-medium tracking-[1.2px]">•••• •••• •••• 5752</div>
          </div>
          <!-- Stacked partial cards -->
          <div class="h-10 bg-white/95 rounded-[10px] p-2.5 text-[#1b1d21] -mt-1.5"><div class="text-[10px] font-medium tracking-[1.2px]">•••• •••• •••• 5752</div></div>
          <div class="h-10 bg-white/80 rounded-[10px] p-2.5 text-[#1b1d21] -mt-1.5"><div class="text-[10px] font-medium tracking-[1.2px]">•••• •••• •••• 5752</div></div>
        </div>
      </div>
    </div>
    <div class="bg-zinc-900 rounded-3xl p-5 text-xs"><div class="text-emerald-400 font-medium mb-2 text-[10px] tracking-[1px] uppercase">Copy-Paste Ready</div><div class="text-zinc-400">Finance / payments card stack. 3 layered cards visual.</div></div>
  </div>
  <script>function copySnippet(){const s=`<div class="w-[184px] h-[224px] bg-[#1b1d21] rounded-[12px] overflow-hidden shadow-2xl p-4" style="box-shadow: 0 10px 30px rgba(0,0,0,0.45);">
  <div class="text-center"><div class="text-xs text-white/60">All cards</div><div class="text-[#808389] text-sm mt-0.5 font-medium">$ 12 051</div></div>
  <div class="mt-5 px-1 space-y-1">
    <div class="h-14 bg-white rounded-[10px] p-2.5 text-[#1b1d21]">
      <div class="flex items-center gap-1"><div class="w-6 h-2 bg-black rounded"></div><div class="w-2.5 h-2 rounded" style="background:#7640ef"></div></div>
      <div class="mt-1 text-[10px] font-medium tracking-[1.2px]">•••• •••• •••• 5752</div>
    </div>
    <div class="h-10 bg-white/95 rounded-[10px] p-2.5 text-[#1b1d21] -mt-1.5"><div class="text-[10px] font-medium tracking-[1.2px]">•••• •••• •••• 5752</div></div>
    <div class="h-10 bg-white/80 rounded-[10px] p-2.5 text-[#1b1d21] -mt-1.5"><div class="text-[10px] font-medium tracking-[1.2px]">•••• •••• •••• 5752</div></div>
  </div>
</div>`;navigator.clipboard.writeText(s).then(()=>alert('Copied!'));}</script>
</body></html>
