<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Card: Add Contact • Watch Me Dark</title><script src="https://cdn.tailwindcss.com"></script><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;display=swap');body{font-family:'Montserrat',system-ui,-apple-system,sans-serif}.card{width:184px;height:224px}</style></head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen p-8"><div class="max-w-[520px] w-full"><div class="flex items-center justify-between mb-6"><div><div class="text-white text-xl font-semibold tracking-tighter">Add Contact</div><div class="text-zinc-500 text-sm">Watch Me • 0:381</div></div><div class="flex gap-2"><button onclick="copyPureHTML()" class="px-4 py-2 text-xs bg-zinc-800 hover:bg-zinc-700 text-white rounded-3xl border border-zinc-700">Pure HTML</button><button onclick="copyAsReact()" class="px-4 py-2 text-xs bg-white text-black rounded-3xl">React</button></div></div>
<div class="flex justify-center mb-6"><div id="add-card" class="card bg-[#1b1d21] rounded-[12px] overflow-hidden shadow-2xl flex flex-col border border-white/5 p-3" style="width:184px;height:224px;box-shadow:0 10px 30px rgba(0,0,0,0.45)">
  <div class="flex justify-center mt-3"><div class="w-[72px] h-[72px] bg-[#272a31] rounded-full flex items-center justify-center"><div class="w-10 h-10 bg-white/80 rounded-full"></div></div></div>
  <div class="mt-2 text-center"><input id="name-input" value="Kira Valakas" class="bg-transparent text-center font-semibold text-sm w-full outline-none border-b border-white/10 focus:border-[#7640ef]"/></div>
  <div class="mt-4 px-2"><button onclick="addContact(this)" class="w-full h-8 rounded-[9px] text-sm font-semibold transition" style="background:#7640ef;color:white">ADD CONTACT</button></div>
  <div id="success-state" class="hidden mt-3 text-center text-emerald-400 text-xs">✓ ADDED TO TEAM</div>
</div></div>
<div class="bg-zinc-900 rounded-3xl p-5 text-xs"><div class="text-emerald-400 font-medium text-[10px] uppercase tracking-[1px]">FORM INTERACTION</div><div class="text-zinc-400">Live editable name. Add button triggers success state with toast. Perfect for contact flows.</div></div></div>
<script>function addContact(btn){btn.textContent='ADDING...'; setTimeout(()=>{btn.style.display='none'; document.getElementById('success-state').classList.remove('hidden'); document.getElementById('success-state').classList.add('block'); alert('Contact added to watch!');},620);} function copyPureHTML(){navigator.clipboard.writeText(document.getElementById('add-card').outerHTML.replace(/onclick="[^"]*"/g,'')).then(()=>alert('Copied'));} function copyAsReact(){navigator.clipboard.writeText('/* AddContactCard */').then(()=>alert('React copied'));} </script></body></html>
