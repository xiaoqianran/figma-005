<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Card: Call • Watch Me Dark</title><script src="https://cdn.tailwindcss.com"></script><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;display=swap');body{font-family:'Montserrat',system-ui,-apple-system,sans-serif}.card{width:184px;height:224px}</style></head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen p-8"><div class="max-w-md w-full"><div class="flex items-center justify-between mb-6"><div><div class="text-white text-xl font-semibold tracking-tighter">Call</div><div class="text-zinc-500 text-sm">Watch Me • Dark Theme</div></div><button onclick="copySnippet()" class="px-5 py-2 text-sm font-medium bg-white text-black rounded-3xl hover:bg-zinc-200 flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16v-4m4 4v4m4-8v8m4-4v-4m-16 8h16a2 2 0 002-2V6a2 2 0 00-2-2H4a2 2 0 00-2 2v12a2 2 0 002 2" /></svg>Copy HTML</button></div>
<div class="flex justify-center mb-6"><div class="card bg-[#1b1d21] rounded-[12px] overflow-hidden shadow-2xl p-4 flex flex-col" style="box-shadow: 0 10px 30px rgba(0,0,0,0.45);" id="call-card">
  <!-- Avatar -->
  <div class="flex justify-center mt-2"><div class="w-16 h-16 rounded-full" style="background:#1b1d21"><div class="w-14 h-14 mx-auto mt-1 rounded-full" style="background:#753fed"></div></div></div>
  <div class="text-center mt-3"><div class="text-sm font-bold text-white">Barbara Payne</div><div class="text-[#808389] text-xs">59:00</div></div>
  <div class="flex-1"></div>
  <!-- Controls -->
  <div class="flex justify-between px-5 pb-3">
    <button onclick="toggleMic(this)" class="w-9 h-9 rounded-full flex items-center justify-center active:scale-95 transition" style="background:#1b1d21"><svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4" /></svg></button>
    <button onclick="endCall(this)" class="w-9 h-9 rounded-full flex items-center justify-center active:scale-95 transition" style="background:#ff4a8c"><svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6h12v12" /></svg></button>
    <button onclick="toggleSpeaker(this)" class="w-9 h-9 rounded-full flex items-center justify-center active:scale-95 transition" style="background:#1b1d21"><svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072M17.95 6.05a8 8 0 010 11.9" /></svg></button>
  </div>
</div></div>
<div class="bg-zinc-900 rounded-3xl p-5 text-xs"><div class="text-emerald-400 font-medium mb-2 text-[10px] tracking-[1px] uppercase">Interactive</div><div class="text-zinc-400">Realistic call UI. Buttons toggle states.</div></div></div>
<script>function toggleMic(el){el.style.background = el.style.background==='#1b1d21' ? '#7640ef' : '#1b1d21';} function toggleSpeaker(el){el.style.background = el.style.background==='#1b1d21' ? '#43a5ff' : '#1b1d21';} function endCall(el){const card=document.getElementById('call-card'); card.style.transition='all .2s'; card.style.opacity='0.4'; setTimeout(()=>{card.innerHTML='<div class="flex h-full items-center justify-center text-xs text-white/60">Call ended</div>';card.style.opacity='1'},220);} function copySnippet(){const s=`<div class="w-[184px] h-[224px] bg-[#1b1d21] rounded-[12px] overflow-hidden shadow-2xl p-4 flex flex-col" style="box-shadow: 0 10px 30px rgba(0,0,0,0.45);">
  <div class="flex justify-center mt-2"><div class="w-16 h-16 rounded-full" style="background:#1b1d21"><div class="w-14 h-14 mx-auto mt-1 rounded-full" style="background:#753fed"></div></div></div>
  <div class="text-center mt-3"><div class="text-sm font-bold text-white">Barbara Payne</div><div class="text-[#808389] text-xs">59:00</div></div>
  <div class="flex-1"></div>
  <div class="flex justify-between px-5 pb-3">
    <div class="w-9 h-9 rounded-full flex items-center justify-center" style="background:#1b1d21"><svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4" /></svg></div>
    <div class="w-9 h-9 rounded-full flex items-center justify-center" style="background:#ff4a8c"><svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6h12v12" /></svg></div>
    <div class="w-9 h-9 rounded-full flex items-center justify-center" style="background:#1b1d21"><svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072M17.95 6.05a8 8 0 010 11.9" /></svg></div>
  </div>
</div>`;navigator.clipboard.writeText(s).then(()=>alert('Copied!'))}</script></body></html>
