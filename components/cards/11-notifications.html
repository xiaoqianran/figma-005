<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Card: Notifications • Watch Me Dark</title><script src="https://cdn.tailwindcss.com"></script><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;display=swap');body{font-family:'Montserrat',system-ui,-apple-system,sans-serif}.card{width:184px;height:224px}</style></head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen p-8"><div class="max-w-[520px] w-full"><div class="flex items-center justify-between mb-6"><div><div class="text-white text-xl font-semibold tracking-tighter">Notifications</div><div class="text-zinc-500 text-sm">Watch Me • 0:176</div></div><div class="flex gap-2"><button onclick="copyPureHTML()" class="px-4 py-2 text-xs bg-zinc-800 hover:bg-zinc-700 text-white rounded-3xl border border-zinc-700">Pure HTML</button><button onclick="copyAsReact()" class="px-4 py-2 text-xs bg-white text-black rounded-3xl">React</button></div></div>
<div class="flex justify-center mb-6"><div id="notif-card" class="card bg-[#1b1d21] rounded-[12px] overflow-hidden shadow-2xl flex flex-col border border-white/5" style="width:184px;height:224px;box-shadow:0 10px 30px rgba(0,0,0,0.45)">
  <div class="p-3 text-sm font-semibold">New notifications</div>
  <div class="grid grid-cols-2 gap-2 px-3">
    <div onclick="dismissNotif(this)" class="bg-[#16171a] rounded-xl h-[58px] flex items-center justify-center text-xl cursor-pointer">📅</div>
    <div onclick="dismissNotif(this)" class="bg-[#16171a] rounded-xl h-[58px] flex items-center justify-center text-xl cursor-pointer relative"><span>🔔</span><div class="absolute top-1 right-1 w-4 h-4 bg-[#ff4a8c] text-[8px] flex items-center justify-center rounded-full font-bold">12</div></div>
    <div onclick="dismissNotif(this)" class="bg-[#16171a] rounded-xl h-[58px] flex items-center justify-center text-xl cursor-pointer">✉️</div>
    <div onclick="dismissNotif(this)" class="bg-[#16171a] rounded-xl h-[58px] flex items-center justify-center text-xl cursor-pointer">👥</div>
  </div>
  <div class="mt-auto p-3 text-[10px] text-center text-white/50">Tap any to dismiss</div>
</div></div>
<div class="bg-zinc-900 rounded-3xl p-5 text-xs"><div class="text-emerald-400 font-medium text-[10px] uppercase tracking-[1px]">INTERACTIVE</div><div class="text-zinc-400">Tap grid icons to dismiss with scale animation. Perfect notifications center card.</div></div></div>
<script>function dismissNotif(el){el.style.transform='scale(0.4)';el.style.opacity='0';setTimeout(()=>{el.style.display='none'},240);} function copyPureHTML(){navigator.clipboard.writeText(document.getElementById('notif-card').outerHTML.replace(/onclick="[^"]*"/g,'')).then(()=>alert('Copied'));} function copyAsReact(){navigator.clipboard.writeText('/* Notifications grid */').then(()=>alert('React copied'));} </script></body></html>
