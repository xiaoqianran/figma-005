<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Card: Activity • Watch Me Dark</title><script src="https://cdn.tailwindcss.com"></script><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;display=swap');body{font-family:'Montserrat',system-ui,-apple-system,sans-serif}.card{width:184px;height:224px}</style></head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen p-8"><div class="max-w-[520px] w-full"><div class="flex items-center justify-between mb-6"><div><div class="text-white text-xl font-semibold tracking-tighter">Activity</div><div class="text-zinc-500 text-sm">Watch Me • 0:206</div></div><div class="flex gap-2"><button onclick="copyPureHTML()" class="px-4 py-2 text-xs bg-zinc-800 hover:bg-zinc-700 text-white rounded-3xl border border-zinc-700">Pure HTML</button><button onclick="copyAsReact()" class="px-4 py-2 text-xs bg-white text-black rounded-3xl">React</button></div></div>
<div class="flex justify-center mb-6"><div id="activity-card" class="card bg-[#1b1d21] rounded-[12px] overflow-hidden shadow-2xl flex flex-col items-center border border-white/5" style="width:184px;height:224px;box-shadow:0 10px 30px rgba(0,0,0,0.45)">
  <div class="pt-3 text-sm font-bold">Activity</div>
  <div class="mt-3 relative w-[104px] h-[104px]" onclick="completeRing()"><svg class="w-[104px] h-[104px] -rotate-90" viewBox="0 0 104 104"><circle cx="52" cy="52" r="44" fill="none" stroke="#272a31" stroke-width="11"/><circle cx="52" cy="52" r="44" fill="none" stroke="#ffaa5c" stroke-width="11" stroke-dasharray="276" stroke-dashoffset="72"/><circle cx="52" cy="52" r="32" fill="none" stroke="#7640ef" stroke-width="9" stroke-dasharray="201" stroke-dashoffset="55"/><circle cx="52" cy="52" r="20" fill="none" stroke="#272a31" stroke-width="7"/></svg><div class="absolute inset-0 flex flex-col items-center justify-center"><div class="text-[13px] font-semibold">1240</div><div class="text-[8px] -mt-0.5 text-white/60">/ 10k</div></div></div>
  <div class="mt-2 text-xs text-[#808389]">1240 / 10000 steps</div>
  <button onclick="completeRing()" class="mt-2 text-[10px] px-3 py-0.5 bg-white/5 rounded">COMPLETE RING</button>
</div></div>
<div class="bg-zinc-900 rounded-3xl p-5 text-xs"><div class="text-emerald-400 font-medium text-[10px] uppercase">INTERACTIVE RINGS</div><div class="text-zinc-400">Tap rings or button to animate completion. 3 concentric activity rings with luxury watch styling.</div></div></div>
<script>function completeRing(){const c=document.getElementById('activity-card');c.style.transitionDuration='180ms';c.style.boxShadow='0 0 0 1px #ffaa5c,0 10px 30px rgba(0,0,0,0.45)';setTimeout(()=>{c.style.boxShadow='0 10px 30px rgba(0,0,0,0.45)';alert('Activity ring closed!')},780);} function copyPureHTML(){navigator.clipboard.writeText(document.getElementById('activity-card').outerHTML.replace(/onclick="[^"]*"/g,'')).then(()=>alert('Copied'));} function copyAsReact(){navigator.clipboard.writeText('/* Activity rings */').then(()=>alert('React copied'));} </script></body></html>
