<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card: Timer • Watch Me Dark</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;display=swap');
    body { font-family: 'Montserrat', system-ui, -apple-system, sans-serif; }
    .card { width: 184px; height: 224px; }
  </style>
</head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen p-8">
  <div class="max-w-md w-full">
    <div class="flex items-center justify-between mb-6">
      <div>
        <div class="text-white text-xl font-semibold tracking-tighter">Timer</div>
        <div class="text-zinc-500 text-sm">Watch Me • Dark Theme</div>
      </div>
      <button onclick="copySnippet()" class="px-5 py-2 text-sm font-medium bg-white text-black rounded-3xl hover:bg-zinc-200 active:scale-[0.985] transition-all flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16v-4m4 4v4m4-8v8m4-4v-4m-16 8h16a2 2 0 002-2V6a2 2 0 00-2-2H4a2 2 0 00-2 2v12a2 2 0 002 2" /></svg>
        Copy HTML
      </button>
    </div>

    <div class="flex justify-center mb-6">
      <div class="card bg-[#1b1d21] rounded-[12px] overflow-hidden shadow-2xl p-4 flex flex-col" style="box-shadow: 0 10px 30px rgba(0,0,0,0.45);">
        <!-- Header -->
        <div class="text-center text-xs text-white/60 tracking-wider">Timer</div>

        <!-- Time slots grid -->
        <div class="grid grid-cols-2 gap-x-1 gap-y-2 text-center mt-4 font-bold text-sm px-1.5 text-white">
          <div>10:29</div>
          <div>11:30</div>
          <div>12:31</div>
          <div>13:32</div>
          <div class="col-span-2 text-base mt-0.5">14:33</div>
        </div>

        <!-- Next button (interactive in catalog) -->
        <div class="mt-auto mx-2 mb-2">
          <button onclick="simulateNext(this)" 
                  class="w-full h-8 rounded-[10px] flex items-center justify-center text-xs font-semibold transition active:scale-[0.985]" 
                  style="background:#7640ef; color:white;">
            Next
          </button>
        </div>
      </div>
    </div>

    <div class="bg-zinc-900 rounded-3xl p-5 text-xs">
      <div class="text-emerald-400 font-medium mb-2 text-[10px] tracking-[1px] uppercase">Interactive</div>
      <div class="text-zinc-400">Click "Next" to highlight selection. Perfect for scheduling or countdown UIs.</div>
    </div>
  </div>

  <script>
    function simulateNext(el) {
      const orig = el.style.background;
      el.style.background = '#ff4a8c';
      el.textContent = 'Selected ✓';
      setTimeout(() => {
        el.style.background = orig;
        el.textContent = 'Next';
      }, 850);
    }

    function copySnippet() {
      const snippet = `<div class="w-[184px] h-[224px] bg-[#1b1d21] rounded-[12px] overflow-hidden shadow-2xl p-4 flex flex-col" style="box-shadow: 0 10px 30px rgba(0,0,0,0.45);">
  <div class="text-center text-xs text-white/60 tracking-wider">Timer</div>
  <div class="grid grid-cols-2 gap-x-1 gap-y-2 text-center mt-4 font-bold text-sm px-1.5 text-white">
    <div>10:29</div><div>11:30</div>
    <div>12:31</div><div>13:32</div>
    <div class="col-span-2 text-base mt-0.5">14:33</div>
  </div>
  <div class="mt-auto mx-2 mb-2">
    <div class="w-full h-8 rounded-[10px] flex items-center justify-center text-xs font-semibold" style="background:#7640ef;color:white;">Next</div>
  </div>
</div>`;
      navigator.clipboard.writeText(snippet).then(() => alert('Copied pure card HTML!'));
    }
  </script>
</body>
</html>
