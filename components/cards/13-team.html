<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Card: Team • Watch Me Dark</title><script src="https://cdn.tailwindcss.com"></script><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;display=swap');body{font-family:'Montserrat',system-ui,-apple-system,sans-serif}.card{width:184px;height:224px}</style></head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen p-8"><div class="max-w-md w-full"><div class="flex items-center justify-between mb-6"><div><div class="text-white text-xl font-semibold tracking-tighter">Team</div><div class="text-zinc-500 text-sm">Watch Me • Dark Theme</div></div><button onclick="copySnippet()" class="px-5 py-2 text-sm font-medium bg-white text-black rounded-3xl hover:bg-zinc-200 flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16v-4m4 4v4m4-8v8m4-4v-4m-16 8h16a2 2 0 002-2V6a2 2 0 00-2-2H4a2 2 0 00-2 2v12a2 2 0 002 2" /></svg>Copy HTML</button></div>
<div class="flex justify-center mb-6"><div class="card bg-[#1b1d21] rounded-[12px] overflow-hidden shadow-2xl p-4" style="box-shadow: 0 10px 30px rgba(0,0,0,0.45);">
  <div class="text-center text-sm font-bold text-white">Team</div>
  <div class="flex justify-center mt-3"><div class="relative w-28 h-28">
    <!-- 8 avatar circles arranged in circle -->
    <div class="absolute w-8 h-8 bg-[#1b1d21] rounded-full" style="left:50%;top:0;transform:translateX(-50%)"></div>
    <div class="absolute w-8 h-8 bg-[#1b1d21] rounded-full" style="right:0;top:50%;transform:translateY(-50%)"></div>
    <div class="absolute w-8 h-8 bg-[#1b1d21] rounded-full" style="left:0;top:50%;transform:translateY(-50%)"></div>
    <div class="absolute w-8 h-8 bg-[#1b1d21] rounded-full" style="left:50%;bottom:0;transform:translateX(-50%)"></div>
    <div class="absolute w-6 h-6 bg-[#1b1d21] rounded-full" style="left:12%;top:12%"></div>
    <div class="absolute w-6 h-6 bg-[#1b1d21] rounded-full" style="right:12%;top:12%"></div>
    <div class="absolute w-6 h-6 bg-[#1b1d21] rounded-full" style="left:12%;bottom:12%"></div>
    <div class="absolute w-6 h-6 bg-[#1b1d21] rounded-full" style="right:12%;bottom:12%"></div>
  </div></div>
</div></div>
<div class="bg-zinc-900 rounded-3xl p-5 text-xs"><div class="text-emerald-400 font-medium mb-2 text-[10px] tracking-[1px] uppercase">Copy-Paste Ready</div><div class="text-zinc-400">Avatar cluster for team / group presence. Extend easily with images.</div></div></div>
<script>function copySnippet(){const s=`<div class="w-[184px] h-[224px] bg-[#1b1d21] rounded-[12px] overflow-hidden shadow-2xl p-4" style="box-shadow: 0 10px 30px rgba(0,0,0,0.45);">
  <div class="text-center text-sm font-bold text-white">Team</div>
  <div class="flex justify-center mt-3"><div class="relative w-28 h-28">
    <div class="absolute w-8 h-8 bg-[#1b1d21] rounded-full" style="left:50%;top:0;transform:translateX(-50%)"></div>
    <div class="absolute w-8 h-8 bg-[#1b1d21] rounded-full" style="right:0;top:50%;transform:translateY(-50%)"></div>
    <div class="absolute w-8 h-8 bg-[#1b1d21] rounded-full" style="left:0;top:50%;transform:translateY(-50%)"></div>
    <div class="absolute w-8 h-8 bg-[#1b1d21] rounded-full" style="left:50%;bottom:0;transform:translateX(-50%)"></div>
    <div class="absolute w-6 h-6 bg-[#1b1d21] rounded-full" style="left:12%;top:12%"></div>
    <div class="absolute w-6 h-6 bg-[#1b1d21] rounded-full" style="right:12%;top:12%"></div>
    <div class="absolute w-6 h-6 bg-[#1b1d21] rounded-full" style="left:12%;bottom:12%"></div>
    <div class="absolute w-6 h-6 bg-[#1b1d21] rounded-full" style="right:12%;bottom:12%"></div>
  </div></div>
</div>`;navigator.clipboard.writeText(s).then(()=>alert('Copied!'))}</script></body></html>
