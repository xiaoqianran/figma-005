<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card: New Message • Watch Me Dark</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;display=swap');
    body { font-family: 'Montserrat', system-ui, -apple-system, sans-serif; }
    .card { width: 184px; height: 224px; }
  </style>
</head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen p-8">
  <div class="max-w-md w-full">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <div>
        <div class="text-white text-xl font-semibold tracking-tighter">New Message</div>
        <div class="text-zinc-500 text-sm">Watch Me • Dark Theme</div>
      </div>
      <button onclick="copySnippet()" 
              class="px-5 py-2 text-sm font-medium bg-white text-black rounded-3xl hover:bg-zinc-200 active:scale-[0.985] transition-all flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16v-4m4 4v4m4-8v8m4-4v-4m-16 8h16a2 2 0 002-2V6a2 2 0 00-2-2H4a2 2 0 00-2 2v12a2 2 0 002 2" />
        </svg>
        Copy HTML
      </button>
    </div>

    <!-- Live Preview -->
    <div class="flex justify-center mb-6">
      <div id="preview-container">
        <!-- The Component -->
        <div class="card bg-[#1b1d21] rounded-[12px] overflow-hidden shadow-2xl relative flex flex-col" style="box-shadow: 0 10px 30px rgba(0,0,0,0.45);">
          <!-- Background -->
          <div class="absolute inset-0 bg-[#1b1d21]"></div>
          
          <!-- Icon Circle + Badge -->
          <div class="relative z-10 flex justify-center pt-5">
            <div class="relative">
              <!-- Purple circle -->
              <div class="w-20 h-20 rounded-full flex items-center justify-center" style="background:#7640ef">
                <!-- White inner circle with chat SVG -->
                <div class="w-9 h-9 bg-white rounded-2xl flex items-center justify-center">
                  <!-- Chat Icon SVG -->
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-[#1b1d21]" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
                  </svg>
                </div>
              </div>
              <!-- Pink notification badge -->
              <div class="absolute -top-1 -right-1 w-7 h-7 rounded-full flex items-center justify-center shadow" style="background:#ff4a8c">
                <span class="text-white text-[13px] font-bold tracking-tighter">3</span>
              </div>
            </div>
          </div>

          <!-- Text Content -->
          <div class="relative z-10 flex-1 flex flex-col justify-end pb-6 text-center">
            <div class="text-white text-[15px] font-bold tracking-[-0.3px]">New Message</div>
            <div class="text-[#808389] text-xs mt-0.5 tracking-[-0.2px]">Oliver Adams</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Usage -->
    <div class="bg-zinc-900 rounded-3xl p-5 text-xs">
      <div class="text-emerald-400 font-medium mb-2 text-[10px] tracking-[1px] uppercase">Copy-Paste Ready</div>
      <div class="text-zinc-400">Drop this card into any Tailwind project. Fixed 184×224px watch-style card.</div>
    </div>
  </div>

  <script>
    function copySnippet() {
      const snippet = `<div class="w-[184px] h-[224px] bg-[#1b1d21] rounded-[12px] overflow-hidden shadow-2xl relative flex flex-col" style="box-shadow: 0 10px 30px rgba(0,0,0,0.45);">
  <div class="absolute inset-0 bg-[#1b1d21]"></div>
  
  <!-- Icon + Badge -->
  <div class="relative z-10 flex justify-center pt-5">
    <div class="relative">
      <div class="w-20 h-20 rounded-full flex items-center justify-center" style="background:#7640ef">
        <div class="w-9 h-9 bg-white rounded-2xl flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-[#1b1d21]" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
          </svg>
        </div>
      </div>
      <div class="absolute -top-1 -right-1 w-7 h-7 rounded-full flex items-center justify-center" style="background:#ff4a8c">
        <span class="text-white text-[13px] font-bold tracking-tighter">3</span>
      </div>
    </div>
  </div>

  <div class="relative z-10 flex-1 flex flex-col justify-end pb-6 text-center">
    <div class="text-white text-[15px] font-bold tracking-[-0.3px]">New Message</div>
    <div class="text-[#808389] text-xs mt-0.5 tracking-[-0.2px]">Oliver Adams</div>
  </div>
</div>`;
      
      navigator.clipboard.writeText(snippet).then(() => {
        const btns = document.querySelectorAll('button');
        const originalTexts = Array.from(btns).map(b => b.innerHTML);
        btns.forEach(b => b.innerHTML = '✓ Copied!');
        setTimeout(() => {
          btns.forEach((b, i) => b.innerHTML = originalTexts[i]);
        }, 1400);
      });
    }

    // Keyboard support
    document.addEventListener('keydown', function(e) {
      if (e.metaKey && e.key === '/') {
        e.preventDefault();
        copySnippet();
      }
    });
    console.log('%c[Watch Me] New Message card ready — press Cmd/Ctrl + / to copy', 'color:#64748b');
  </script>
</body>
</html>
