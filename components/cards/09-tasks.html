<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Card: Tasks • Watch Me Dark</title><script src="https://cdn.tailwindcss.com"></script><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;display=swap');body{font-family:'Montserrat',system-ui,-apple-system,sans-serif}.card{width:184px;height:224px}</style></head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen p-8"><div class="max-w-[520px] w-full"><div class="flex items-center justify-between mb-6"><div><div class="text-white text-xl font-semibold tracking-tighter">Tasks</div><div class="text-zinc-500 text-sm">Watch Me • 0:138</div></div><div class="flex gap-2"><button onclick="copyPureHTML()" class="px-4 py-2 text-xs bg-zinc-800 hover:bg-zinc-700 text-white rounded-3xl border border-zinc-700">Pure HTML</button><button onclick="copyAsReact()" class="px-4 py-2 text-xs bg-white text-black rounded-3xl">React</button></div></div>
<div class="flex justify-center mb-6"><div id="tasks-card" class="card bg-[#1b1d21] rounded-[12px] overflow-hidden shadow-2xl flex flex-col border border-white/5" style="width:184px;height:224px;box-shadow:0 10px 30px rgba(0,0,0,0.45)">
  <div class="px-3 pt-2 flex justify-between text-xs"><div class="text-white/50">Back</div><div class="font-bold">Tasks</div></div>
  <div class="px-3 mt-2 text-[10px] flex gap-3"><div onclick="filterTab(this,'today')" class="active-tab font-bold cursor-pointer">Today</div><div onclick="filterTab(this,'week')" class="cursor-pointer text-white/60">Week</div></div>
  <div id="task-list" class="px-3 mt-2 space-y-1 text-xs flex-1">
    <div class="flex items-center gap-2 bg-[#16171a] rounded px-2 py-1"><input type="checkbox" onchange="toggleTask(this)" class="accent-[#7640ef]"><span>Drink 2 liters of water</span></div>
    <div class="flex items-center gap-2 px-2 py-1"><input type="checkbox" checked onchange="toggleTask(this)" class="accent-[#7640ef]"><span class="line-through text-white/50">Call grandma at 8 AM</span></div>
  </div>
  <div class="p-2"><input id="new-task" placeholder="Add new task..." class="w-full bg-[#16171a] text-xs px-2 py-1 rounded" onkeydown="if(event.key==='Enter')addNewTask()"></div>
</div></div>
<div class="bg-zinc-900 rounded-3xl p-5 text-xs"><div class="text-emerald-400 font-medium text-[10px] uppercase">CRUD + TOGGLE</div><div class="text-zinc-400">Checkboxes strike through. Add via input. Tab filter. Full task management in card.</div></div></div>
<script>function toggleTask(chk){chk.parentElement.querySelector('span').classList.toggle('line-through', chk.checked);} function filterTab(el,t){document.querySelectorAll('#tasks-card .px-3.mt-2.text-\\[10px\\] > div').forEach(d=>d.classList.remove('font-bold','active-tab')); el.classList.add('font-bold','active-tab');} function addNewTask(){const inp=document.getElementById('new-task'); if(!inp.value) return; const list=document.getElementById('task-list'); const d=document.createElement('div'); d.className='flex items-center gap-2 px-2 py-1'; d.innerHTML=`<input type="checkbox" onchange="toggleTask(this)" class="accent-[#7640ef]"><span>${inp.value}</span>`; list.appendChild(d); inp.value='';} function copyPureHTML(){navigator.clipboard.writeText(document.getElementById('tasks-card').outerHTML.replace(/on\\w+="[^"]*"/g,'')).then(()=>alert('Copied'));} function copyAsReact(){navigator.clipboard.writeText('/* TasksCard with state */').then(()=>alert('React copied'));} </script></body></html>
