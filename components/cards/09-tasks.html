<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Card: Tasks • Watch Me Dark</title><script src="https://cdn.tailwindcss.com"></script><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;display=swap');body{font-family:'Montserrat',system-ui,-apple-system,sans-serif}.card{width:184px;height:224px}</style></head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen p-8"><div class="max-w-md w-full"><div class="flex items-center justify-between mb-6"><div><div class="text-white text-xl font-semibold tracking-tighter">Tasks</div><div class="text-zinc-500 text-sm">Watch Me • Dark Theme</div></div><button onclick="copySnippet()" class="px-5 py-2 text-sm font-medium bg-white text-black rounded-3xl hover:bg-zinc-200 flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16v-4m4 4v4m4-8v8m4-4v-4m-16 8h16a2 2 0 002-2V6a2 2 0 00-2-2H4a2 2 0 00-2 2v12a2 2 0 002 2" /></svg>Copy HTML</button></div>
<div class="flex justify-center mb-6"><div class="card bg-[#1b1d21] rounded-[12px] overflow-hidden shadow-2xl p-4" style="box-shadow: 0 10px 30px rgba(0,0,0,0.45);">
  <div class="flex justify-between text-xs"><div class="text-[#808389]">Back</div><div class="font-bold text-white">Tasks</div></div>
  <div class="flex gap-3 mt-2.5 text-xs"><div class="text-white font-bold border-b border-white pb-0.5">Today</div><div class="text-[#808389]">Week</div><div class="text-[#808389]">Month</div></div>
  <div class="mt-3 space-y-1.5 text-xs" id="tasks-list">
    <div onclick="toggleTask(this)" class="flex items-center gap-2 bg-[#1b1d21] rounded-xl px-3 py-[7px] cursor-pointer"><div class="w-3.5 h-3.5 border border-white rounded flex-shrink-0"></div><span class="text-white">Drink 2 liters of water</span></div>
    <div onclick="toggleTask(this)" class="flex items-center gap-2 px-3 py-[7px] cursor-pointer"><div class="w-3.5 h-3.5 bg-[#7640ef] rounded flex items-center justify-center flex-shrink-0"><svg class="w-2 h-2 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4"><path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7"/></svg></div><span class="line-through text-[#808389]">Call grandma at 8 AM</span></div>
  </div>
</div></div>
<div class="bg-zinc-900 rounded-3xl p-5 text-xs"><div class="text-emerald-400 font-medium mb-2 text-[10px] tracking-[1px] uppercase">Interactive</div><div class="text-zinc-400">Click rows to toggle completion. Add your own items easily.</div></div></div>
<script>function toggleTask(el){const check=el.querySelector('div'); if(check.classList.contains('bg-[#7640ef]')){check.classList.remove('bg-[#7640ef]');check.classList.add('border','border-white');check.innerHTML='';el.querySelector('span').classList.remove('line-through','text-[#808389]');el.querySelector('span').classList.add('text-white');}else{check.classList.add('bg-[#7640ef]');check.classList.remove('border','border-white');check.innerHTML='<svg class="w-2 h-2 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4"><path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7"/></svg>';el.querySelector('span').classList.add('line-through','text-[#808389]');el.querySelector('span').classList.remove('text-white');}} function copySnippet(){const s=`<div class="w-[184px] h-[224px] bg-[#1b1d21] rounded-[12px] overflow-hidden shadow-2xl p-4" style="box-shadow: 0 10px 30px rgba(0,0,0,0.45);">
  <div class="flex justify-between text-xs"><div class="text-[#808389]">Back</div><div class="font-bold text-white">Tasks</div></div>
  <div class="flex gap-3 mt-2.5 text-xs"><div class="text-white font-bold">Today</div><div class="text-[#808389]">Week</div><div class="text-[#808389]">Month</div></div>
  <div class="mt-3 space-y-1.5 text-xs">
    <div class="flex items-center gap-2 bg-[#1b1d21] rounded-xl px-3 py-[7px]"><div class="w-3.5 h-3.5 border border-white rounded"></div><span>Drink 2 liters of water</span></div>
    <div class="flex items-center gap-2 px-3 py-[7px]"><div class="w-3.5 h-3.5 bg-[#7640ef] rounded flex items-center justify-center"><svg class="w-2 h-2 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4"><path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7"/></svg></div><span class="line-through text-[#808389]">Call grandma at 8 AM</span></div>
  </div>
</div>`;navigator.clipboard.writeText(s).then(()=>alert('Copied!'))}</script></body></html>
