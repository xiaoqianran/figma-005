<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card: Voice Message • Watch Me Dark</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;display=swap');
    body { font-family: 'Montserrat', system-ui, -apple-system, sans-serif; }
    .card { width: 184px; height: 224px; }
  </style>
</head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen p-8">
  <div class="max-w-md w-full">
    <div class="flex items-center justify-between mb-6">
      <div>
        <div class="text-white text-xl font-semibold tracking-tighter">Voice Message</div>
        <div class="text-zinc-500 text-sm">Watch Me • Dark Theme</div>
      </div>
      <button onclick="copySnippet()" 
              class="px-5 py-2 text-sm font-medium bg-white text-black rounded-3xl hover:bg-zinc-200 active:scale-[0.985] transition-all flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16v-4m4 4v4m4-8v8m4-4v-4m-16 8h16a2 2 0 002-2V6a2 2 0 00-2-2H4a2 2 0 00-2 2v12a2 2 0 002 2" /></svg>
        Copy HTML
      </button>
    </div>

    <!-- Live Preview -->
    <div class="flex justify-center mb-6">
      <div class="card bg-[#1b1d21] rounded-[12px] overflow-hidden shadow-2xl relative flex flex-col" style="box-shadow: 0 10px 30px rgba(0,0,0,0.45);">
        <div class="flex-1 flex flex-col pt-6">
          <!-- Title -->
          <div class="px-4 text-center">
            <div class="text-white text-[15px] font-bold leading-[17px] tracking-[-0.4px]">Leave<br>voice message</div>
          </div>
          
          <!-- Big Mic / Waveform visual -->
          <div class="flex-1 flex items-center justify-center">
            <div class="relative w-[90px] h-[90px]">
              <!-- Outer ring -->
              <div class="absolute inset-0 rounded-full border-[5px]" style="border-color:#7d3ef3"></div>
              <!-- Inner dark circle -->
              <div class="absolute inset-[9px] rounded-full" style="background:#16171a"></div>
              <!-- Mic SVG centered -->
              <div class="absolute inset-0 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-white/90" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.25">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0-4H5m7 0a7 7 0 01-7-7m7 7a7 7 0 007-7" />
                </svg>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Footer label -->
        <div class="pb-4 text-center">
          <div class="text-[#808389] text-xs tracking-[-0.2px]">Tap and talk</div>
        </div>
      </div>
    </div>

    <div class="bg-zinc-900 rounded-3xl p-5 text-xs">
      <div class="text-emerald-400 font-medium mb-2 text-[10px] tracking-[1px] uppercase">Copy-Paste Ready</div>
      <div class="text-zinc-400">Voice recorder prompt card. Great for messaging or recording flows.</div>
    </div>
  </div>

  <script>
    function copySnippet() {
      const snippet = `<div class="w-[184px] h-[224px] bg-[#1b1d21] rounded-[12px] overflow-hidden shadow-2xl relative flex flex-col" style="box-shadow: 0 10px 30px rgba(0,0,0,0.45);">
  <div class="flex-1 flex flex-col pt-6">
    <div class="px-4 text-center">
      <div class="text-white text-[15px] font-bold leading-[17px] tracking-[-0.4px]">Leave<br>voice message</div>
    </div>
    <div class="flex-1 flex items-center justify-center">
      <div class="relative w-[90px] h-[90px]">
        <div class="absolute inset-0 rounded-full border-[5px]" style="border-color:#7d3ef3"></div>
        <div class="absolute inset-[9px] rounded-full" style="background:#16171a"></div>
        <div class="absolute inset-0 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-white/90" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.25">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0-4H5m7 0a7 7 0 01-7-7m7 7a7 7 0 007-7" />
          </svg>
        </div>
      </div>
    </div>
  </div>
  <div class="pb-4 text-center">
    <div class="text-[#808389] text-xs tracking-[-0.2px]">Tap and talk</div>
  </div>
</div>`;
      navigator.clipboard.writeText(snippet).then(() => {
        const btn = event.currentTarget;
        const orig = event.target.innerHTML;
        event.target.innerHTML = '✓ Copied!';
        setTimeout(() => { if (event.target) event.target.innerHTML = orig; }, 1400);
      });
    }
  </script>
</body>
</html>
