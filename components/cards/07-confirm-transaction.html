<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Card: Confirm Transaction • Watch Me Dark</title><script src="https://cdn.tailwindcss.com"></script><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;display=swap');body{font-family:'Montserrat',system-ui,-apple-system,sans-serif}.card{width:184px;height:224px}</style></head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen p-8"><div class="max-w-[520px] w-full"><div class="flex items-center justify-between mb-6"><div><div class="text-white text-xl font-semibold tracking-tighter">Confirm Tx</div><div class="text-zinc-500 text-sm">Watch Me • 0:90</div></div><div class="flex gap-2"><button onclick="copyPureHTML()" class="px-4 py-2 text-xs bg-zinc-800 hover:bg-zinc-700 text-white rounded-3xl border border-zinc-700">Pure HTML</button><button onclick="copyAsReact()" class="px-4 py-2 text-xs bg-white text-black rounded-3xl">React</button></div></div>
<div class="flex justify-center mb-6"><div id="tx-card" class="card bg-[#1b1d21] rounded-[12px] overflow-hidden shadow-2xl flex flex-col items-center justify-center border border-white/5" style="width:184px;height:224px;box-shadow:0 10px 30px rgba(0,0,0,0.45)">
  <div class="w-20 h-20 rounded-full flex items-center justify-center" style="background:#7640ef" onclick="confirmTx(this)"><svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18" /></svg></div>
  <div class="mt-4 text-center"><div class="font-semibold">$1,250.00</div><div class="text-xs text-white/50">to 0xA3f...9c1</div></div>
  <div class="mt-4 px-4 w-full"><button onclick="confirmTx(this)" class="w-full h-8 rounded-[9px] text-sm font-semibold" style="background:#ff4a8c;color:white">HOLD TO CONFIRM</button></div>
</div></div>
<div class="bg-zinc-900 rounded-3xl p-5 text-xs"><div class="text-emerald-400 font-medium text-[10px] uppercase tracking-[1px]">2 INTERACTIONS</div><div class="text-zinc-400">Tap icon or button for success state + checkmark animation. Used in wallet flows.</div></div></div>
<script>function confirmTx(el){const card=document.getElementById('tx-card'); card.innerHTML=`<div class="flex flex-col items-center justify-center h-full"><div class="w-16 h-16 rounded-full flex items-center justify-center" style="background:#10b981"><svg class="w-9 h-9 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg></div><div class="mt-4 font-semibold text-emerald-400">CONFIRMED</div><div class="text-[10px] text-white/50">TX #8F2A1C</div></div>`; setTimeout(()=>alert('Transaction confirmed in real app'),900);} function copyPureHTML(){navigator.clipboard.writeText(document.getElementById('tx-card').outerHTML.replace(/onclick="[^"]*"/g,'')).then(()=>alert('Copied'));} function copyAsReact(){navigator.clipboard.writeText('/* ConfirmTxCard */').then(()=>alert('React copied'));} </script></body></html>
