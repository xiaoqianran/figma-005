<!-- Clock Card -->
<div class="w-[184px] h-[224px] bg-[#1b1d21] rounded-2xl overflow-hidden text-white flex flex-col" style="font-family: 'Montserrat', system-ui, sans-serif;">
  <div class="flex justify-between px-3 pt-3 text-xs">
    <div style="color:#808389">Back</div>
    <div class="font-bold">Time</div>
  </div>
  
  <div class="flex-1 flex items-center justify-center">
    <div class="relative w-28 h-28 rounded-full" style="background:#1b1d21">
      <!-- Clock hands (simplified) -->
      <div class="absolute top-1/2 left-1/2 w-0.5 h-8 bg-[#7c3cfd] origin-bottom" style="transform: translate(-50%, -100%) rotate(120deg)"></div>
      <div class="absolute top-1/2 left-1/2 w-0.5 h-6 bg-white origin-bottom" style="transform: translate(-50%, -100%) rotate(30deg)"></div>
    </div>
  </div>
</div>
