<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Card: Overall Progress • Watch Me Dark</title><script src="https://cdn.tailwindcss.com"></script><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;display=swap');body{font-family:'Montserrat',system-ui,-apple-system,sans-serif}.card{width:184px;height:224px}</style></head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen p-8"><div class="max-w-[520px] w-full"><div class="flex items-center justify-between mb-6"><div><div class="text-white text-xl font-semibold tracking-tighter">Overall Progress</div><div class="text-zinc-500 text-sm">Watch Me • Dark Theme • 0:58</div></div><div class="flex gap-2"><button onclick="copyPureHTML()" class="px-4 py-2 text-xs bg-zinc-800 hover:bg-zinc-700 text-white rounded-3xl border border-zinc-700">Pure HTML</button><button onclick="copyAsReact()" class="px-4 py-2 text-xs bg-white text-black rounded-3xl">React</button></div></div>
<div class="flex justify-center mb-6"><div id="progress-card" class="card bg-[#1b1d21] rounded-[12px] overflow-hidden shadow-2xl flex flex-col border border-white/5" style="width:184px;height:224px;box-shadow:0 10px 30px rgba(0,0,0,0.45)">
  <div class="px-3 pt-2 flex justify-between text-[10px]"><div class="text-white/50">Back</div><div class="font-medium text-white">20:00</div></div>
  <div class="flex justify-center mt-3"><div class="relative w-[108px] h-[108px]" onclick="bumpProgress()"><svg class="w-[108px] h-[108px] -rotate-90" viewBox="0 0 108 108"><circle cx="54" cy="54" r="44" fill="none" stroke="#272a31" stroke-width="12"/><circle id="progress-arc" cx="54" cy="54" r="44" fill="none" stroke="#7640ef" stroke-width="12" stroke-dasharray="276" stroke-dashoffset="110" stroke-linecap="round"/></svg><div class="absolute inset-0 flex flex-col items-center justify-center"><div id="pct" class="text-[34px] font-semibold tracking-[-1.5px]">40</div><div class="text-[9px] -mt-1 text-white/50">OVERALL</div></div></div></div>
  <div class="px-3 mt-auto pb-4"><div class="h-1.5 bg-white/10 rounded"><div class="h-1.5 w-[40%] bg-gradient-to-r from-[#7640ef] to-[#ff4a8c] rounded transition-all" id="bar"></div></div><div class="flex justify-between text-[9px] mt-1 text-white/50"><div>GOAL 100%</div><div onclick="bumpProgress()" class="cursor-pointer active:text-white">+10%</div></div></div>
</div></div>
<div class="bg-zinc-900 rounded-3xl p-5 text-xs"><div class="text-emerald-400 font-medium text-[10px] tracking-[1px] uppercase">2 INTERACTIONS</div><div class="text-zinc-400">Tap the ring or +10% label to animate progress. Beautiful dual visual (ring + bar). Use in health dashboards.</div></div></div>
<script>let p=40;function updateP(){document.getElementById('pct').textContent=p; document.getElementById('bar').style.width=p+'%'; const arc=document.getElementById('progress-arc'); if(arc) arc.setAttribute('stroke-dashoffset', 276*(1-p/100));} function bumpProgress(){p=Math.min(100,p+10); updateP(); if(p===100) setTimeout(()=>{document.getElementById('progress-card').style.boxShadow='0 0 0 1px #10b981,0 10px 30px rgba(0,0,0,0.45)'},120);} function copyPureHTML(){navigator.clipboard.writeText(document.getElementById('progress-card').outerHTML.replace(/onclick="[^"]*"/g,'')).then(()=>alert('Copied'));} function copyAsReact(){navigator.clipboard.writeText('/* Progress rings card */').then(()=>alert('React copied'));} window.addEventListener('load',()=>{updateP(); console.log('%c[Watch Me] Progress card ready','color:#64748b')});</script></body></html>
