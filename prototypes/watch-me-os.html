<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Me OS • Square Edition • The Instrument</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="../scripts/os-core.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
    
    :root, [data-theme="light"] {
      --wm-bg: #ffffff;
      --wm-surface: #ffffff;
      --wm-surface-2: #f7f7f5;
      --wm-ink: #000000;
      --wm-ink-soft: #5f6166;
      --wm-border: #e6e6e6;
      --wm-magenta: #ff3d8b;
      --wm-lime: #dceeb1;
      --wm-lilac: #c5b0f4;
      --wm-purple: #c5b0f4;
      --wm-mint: #c8e6cd;
      --wm-cream: #f4ecd6;
      --wm-pink: #efd4d4;
      --wm-coral: #f3c9b6;
      --wm-navy: #1f1d3d;
      --wm-gold: #c5a26f;
      --wm-page-bg: #f4f4f6;
      --wm-frame: #111111;
      --wm-button-bg: #000000;
      --wm-button-fg: #ffffff;
    }

    [data-theme="dark"] {
      --wm-bg: #1b1d21;
      --wm-surface: #1b1d21;
      --wm-surface-2: #272a31;
      --wm-ink: #ffffff;
      --wm-ink-soft: #808389;
      --wm-border: #33363d;
      --wm-magenta: #ff4a8c;
      --wm-purple: #7640ef;
      --wm-page-bg: #0c0c0e;
      --wm-frame: #0a0a0a;
      --wm-button-bg: #7640ef;
      --wm-button-fg: #ffffff;
    }

    [data-theme="gold"] {
      --wm-bg: #1f1a14;
      --wm-surface: #1f1a14;
      --wm-surface-2: #2a231a;
      --wm-ink: #f5e8c7;
      --wm-ink-soft: #a38f6f;
      --wm-border: #3d3428;
      --wm-magenta: #ff8f4d;
      --wm-purple: #c5a26f;
      --wm-page-bg: #12100c;
      --wm-frame: #0f0c08;
      --wm-button-bg: #c5a26f;
      --wm-button-fg: #1f1a14;
    }

    body { font-family: 'Inter', system-ui, sans-serif; background: var(--wm-page-bg); color: var(--wm-ink); }
    .display-font { font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 600; letter-spacing: -0.04em; }

    .watch-container {
      width: 420px;
      height: 520px;
      position: relative;
      filter: drop-shadow(0 40px 100px rgba(0,0,0,0.25));
    }

    .watch-frame {
      width: 100%;
      height: 100%;
      background: var(--wm-frame);
      border-radius: 48px;
      padding: 12px;
      box-shadow: 
        0 0 0 1px #333,
        0 10px 30px rgba(0,0,0,0.2);
      position: relative;
    }

    .watch-screen {
      width: 100%;
      height: 100%;
      border-radius: 36px;
      background: var(--wm-bg);
      box-shadow: inset 0 0 0 1px var(--wm-border);
      overflow: hidden;
      position: relative;
      z-index: 10;
      color: var(--wm-ink);
    }

    .crown {
      position: absolute;
      right: -28px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 80px;
      background: linear-gradient(90deg, #e5e5e5, #a3a3a3 40%, #52525b);
      border-radius: 10px;
      box-shadow: 3px 0 8px rgba(0,0,0,0.3);
      cursor: ns-resize;
      z-index: 50;
      border: 1px solid #d4d4d8;
    }
    .crown::after {
      content: '';
      position: absolute;
      inset: 8px 3px;
      background: repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(63, 63, 70, 0.4) 2px, rgba(63, 63, 70, 0.4) 4px);
      border-radius: 6px;
    }

    /* Side pusher — short = home, long = app switcher */
    .side-pusher {
      position: absolute;
      left: -18px;
      top: 42%;
      transform: translateY(-50%);
      width: 14px;
      height: 44px;
      background: linear-gradient(90deg, #a3a3a3, #e5e5e5 50%, #737373);
      border-radius: 4px 2px 2px 4px;
      box-shadow: -2px 0 6px rgba(0,0,0,0.25);
      cursor: pointer;
      z-index: 50;
      border: 1px solid #d4d4d8;
      touch-action: none;
    }
    .side-pusher:active {
      transform: translateY(-50%) translateX(-1px);
    }

    .screen { width: 100%; height: 100%; position: relative; overflow: hidden; }
    .status-bar {
      height: 32px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between;
      font-size: 14px; font-weight: 600; letter-spacing: 0.3px; 
      background: var(--wm-surface-2);
      border-bottom: 1px solid var(--wm-border);
      position: relative; z-index: 40;
      color: var(--wm-ink-soft);
    }
    .screen-content {
      padding-top: 28px;
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: 18px;
      height: 100%;
      box-sizing: border-box;
    }
    .app-grid { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 14px; 
      padding: 8px 4px;
    }
    .app-icon {
      aspect-ratio: 1; 
      border-radius: 20px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      background: var(--wm-surface-2);
      border: 1px solid var(--wm-border);
      transition: all 0.1s cubic-bezier(0.23,1,0.32,1); 
      cursor: pointer; 
      font-size: 13px; 
      gap: 6px;
      min-height: 78px;
      color: var(--wm-ink);
    }
    .app-icon:hover { filter: brightness(0.97); }
    .app-icon:active { transform: scale(0.93); }
    .app-icon .fa { font-size: 26px; margin-bottom: 2px; color: var(--wm-magenta); }
    .app-icon span { font-size: 12px; opacity: 0.9; color: var(--wm-ink); font-weight: 500; }

    .page-dots {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
    }
    .page-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--wm-border);
    }
    .page-dot.active { background: var(--wm-magenta); }

    .app-header { 
      padding: 14px 18px 10px; 
      font-weight: 600; 
      font-size: 16px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      color: var(--wm-ink);
      border-bottom: 1px solid var(--wm-border);
    }
    .list-item {
      padding: 13px 18px; 
      margin: 4px 12px; 
      border-radius: 14px; 
      display: flex; 
      align-items: center; 
      gap: 14px;
      background: var(--wm-surface); 
      border: 1px solid var(--wm-border);
      transition: all 0.1s; 
      min-height: 48px;
      color: var(--wm-ink);
      font-size: 14px;
    }
    .list-item:hover { background: var(--wm-surface-2); }
    .list-item:active { transform: scale(0.985); }
    .lux-button {
      background: var(--wm-button-bg); color: var(--wm-button-fg); font-weight: 600; font-size: 14px;
      padding: 10px 20px; border-radius: 9999px; transition: all 0.1s;
    }
    .lux-button:active { transform: scale(0.96); }
    .lux-button.secondary {
      background: var(--wm-surface); color: var(--wm-ink); border: 1px solid var(--wm-ink); font-size: 14px;
    }

    .ring { transition: stroke-dashoffset 400ms cubic-bezier(0.23,1,0.32,1); }
    .wm-gold { color: var(--wm-gold); }
    .wm-purple { color: var(--wm-purple); }

    .toast {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: var(--wm-surface); color: var(--wm-ink); font-size: 14px; padding: 8px 16px; border-radius: 9999px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid var(--wm-border);
      opacity: 0; transition: all 0.2s; pointer-events: none;
      white-space: nowrap; z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

    .crown-active { box-shadow: 0 0 0 3px rgba(197,162,111,0.3); }

    .dev-harness {
      margin-top: 12px; background: var(--wm-surface); border: 1px solid var(--wm-border); border-radius: 12px;
      font-size: 12px; padding: 10px 12px; color: var(--wm-ink-soft); width: 480px;
    }
    .dev-harness button {
      font-size: 11px; padding: 3px 10px; background: var(--wm-surface-2); border: 1px solid var(--wm-border); border-radius: 6px; margin: 2px; color: var(--wm-ink);
    }
    .dev-harness button:hover { background: var(--wm-magenta); color: #fff; border-color: var(--wm-magenta); }

    .meta-chip {
      padding: 6px 16px; border-radius: 16px; background: var(--wm-surface-2); cursor: pointer;
      display: flex; align-items: center; gap: 8px; color: var(--wm-ink); border: 1px solid var(--wm-border);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-8">
  <div class="flex flex-col items-center">
    <div class="mb-4 flex items-center gap-3 text-sm">
      <div class="flex items-center gap-2">
        <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
        <span class="font-medium tracking-[1px] text-sm" style="color:var(--wm-ink-soft)">WATCH ME OS v1.0</span>
      </div>
      <div class="h-3 w-px" style="background:var(--wm-border)"></div>
      <div class="px-2 py-0.5 text-sm rounded font-mono tracking-wider" style="background:var(--wm-lime);color:#000">SQUARE</div>
      <button onclick="resetAll()" class="text-sm flex items-center gap-1.5 transition-colors" style="color:var(--wm-ink-soft)">
        <i class="fa-solid fa-undo text-sm"></i> RESET STATE
      </button>
      <button onclick="cycleTheme()" 
              class="px-3 py-1 rounded-full text-sm flex items-center gap-1.5 transition-all"
              style="background:var(--wm-surface-2);color:var(--wm-ink);border:1px solid var(--wm-border)">
        <i class="fa-solid fa-palette"></i> <span id="theme-label">LIGHT</span>
      </button>
    </div>

    <div class="watch-container" id="watch-container">
      <div class="watch-frame">
        <div class="watch-screen" id="screen">
          <div id="screen-root" class="screen"></div>
        </div>
      </div>

      <div class="side-pusher" id="side-pusher" title="Side button — short: Home · long: Switcher" role="button" aria-label="Side button"></div>
      <div class="crown" id="crown" title="Digital Crown — drag vertically"></div>
    </div>

    <div class="mt-5 flex gap-2 text-sm">
      <div onclick="navigate('home')" class="meta-chip">
        <i class="fa-solid fa-home"></i> <span>Home</span>
      </div>
      <div onclick="showAppSwitcher()" class="meta-chip">
        <i class="fa-solid fa-layer-group"></i> <span>Switcher</span>
      </div>
      <div onclick="postDemoNotification()" class="meta-chip">
        <i class="fa-solid fa-bell"></i> <span>Notify</span>
      </div>
    </div>

    <div class="mt-3 text-sm tracking-widest" style="color:var(--wm-ink-soft)">DRAG CROWN • TAP ICONS • LONG-PRESS SIDE BUTTON</div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // ==================== WATCH ME OS — CORE ====================
    const Core = window.WMCore;
    if (!Core) {
      console.error('[Watch Me OS] WMCore missing — load scripts/os-core.js');
    }

    const WM = window.WM = {
      version: '1.0.1-hardened',
      state: Core ? Core.createDefaultState() : {},
      history: [],
      crownValue: 0,
      crownMomentum: 0
    };

    // Persistence key: wm_state_v1 (also Core.STORAGE_KEY)
    function loadState() {
      try {
        const saved = localStorage.getItem(Core.STORAGE_KEY); // wm_state_v1
        WM.state = Core.parseStoredState(saved, Core.createDefaultState());
      } catch (e) {
        WM.state = Core.createDefaultState();
      }
    }
    function saveState() {
      try {
        localStorage.setItem(Core.STORAGE_KEY /* wm_state_v1 */, Core.serializeState(WM.state));
      } catch (e) {}
    }

    function showToast(msg, ms = 1600) {
      const t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), ms);
    }

    function applyThemeToDom(theme) {
      const t = theme || WM.state.theme || 'light';
      document.documentElement.setAttribute('data-theme', t);
      const label = document.getElementById('theme-label');
      if (label) label.textContent = t.toUpperCase();
    }

    function updateTime() {
      const now = new Date();
      WM.state.time.h = now.getHours();
      WM.state.time.m = now.getMinutes();
      const clocks = document.querySelectorAll('[data-live-time]');
      clocks.forEach(el => {
        el.textContent = `${String(WM.state.time.h).padStart(2,'0')}:${String(WM.state.time.m).padStart(2,'0')}`;
      });
    }

    function cycleTheme() {
      Core.cycleTheme(WM.state);
      applyThemeToDom(WM.state.theme);
      saveState();
      if (WM.state.currentApp) renderApp(WM.state.currentApp);
    }

    // ==================== RENDER REGISTRY ====================
    const Apps = {};

    function registerApp(name, renderFn, icon = 'fa-square') {
      Apps[name] = { render: renderFn, icon };
    }

    function navigate(app, props = {}) {
      WM.state.currentApp = app;
      WM.history.push(app);
      if (WM.history.length > 6) WM.history.shift();
      renderApp(app, props);
      saveState();
    }

    function renderApp(name, props = {}) {
      const root = document.getElementById('screen-root');
      if (!root) return;
      root.innerHTML = '';
      root.dataset.app = name;

      if (Apps[name]) {
        Apps[name].render(root, props);
      } else {
        root.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center p-6 text-center" style="background:var(--wm-bg)">
            <i class="fa-solid fa-rocket text-3xl mb-3 opacity-50" style="color:var(--wm-ink-soft)"></i>
            <div class="font-semibold text-sm" style="color:var(--wm-ink)">${String(name).toUpperCase()}</div>
            <div class="text-sm mt-1" style="color:var(--wm-ink-soft)">App coming in next OTA</div>
            <button onclick="navigate('home')" class="mt-6 lux-button text-sm px-5 py-1.5">Return Home</button>
          </div>`;
      }
      updateTime();
    }

    // ==================== CROWN PHYSICS ====================
    let crownDragging = false;
    let crownLastY = 0;
    let crownLastTime = 0;

    function initCrown() {
      const crown = document.getElementById('crown');
      if (!crown) return;

      function onPointerDown(e) {
        crownDragging = true;
        crownLastY = e.clientY || (e.touches && e.touches[0].clientY);
        crownLastTime = Date.now();
        WM.crownMomentum = 0;
        crown.classList.add('crown-active');
        e.preventDefault();
      }
      function onPointerMove(e) {
        if (!crownDragging) return;
        const y = e.clientY || (e.touches && e.touches[0].clientY);
        const delta = (y - crownLastY) * -1.2;
        WM.crownValue += delta;
        WM.crownMomentum = delta * 0.6;
        crownLastY = y;
        const now = Date.now();
        if (now - crownLastTime > 40) {
          applyCrownEffect(delta);
          crownLastTime = now;
        }
      }
      function onPointerUp() {
        if (!crownDragging) return;
        crownDragging = false;
        crown.classList.remove('crown-active');
        if (Math.abs(WM.crownMomentum) > 0.8) {
          const decay = setInterval(() => {
            WM.crownMomentum *= 0.86;
            if (Math.abs(WM.crownMomentum) < 0.6) { clearInterval(decay); return; }
            applyCrownEffect(WM.crownMomentum);
          }, 32);
        }
      }

      crown.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      crown.addEventListener('touchstart', onPointerDown, {passive:false});
      window.addEventListener('touchmove', onPointerMove, {passive:false});
      window.addEventListener('touchend', onPointerUp);
    }

    function applyCrownEffect(delta) {
      const root = document.getElementById('screen-root');
      if (!root) return;
      const app = root.dataset.app;

      if (Math.abs(delta) > 2.5 && WM.playDetent) WM.playDetent();

      if (app === 'timer') {
        // Crown scrubs remaining while Timer is active (idle or running)
        const next = Core.scrubTimer(WM.state, delta * 1.8);
        const timerEl = root.querySelector('#timer-display');
        if (timerEl) timerEl.textContent = Core.formatTime(next);
      } else if (app === 'music') {
        WM.state.music.progress = Math.max(0, Math.min(100, WM.state.music.progress + delta * 0.6));
        const bar = root.querySelector('#music-progress');
        if (bar) bar.style.width = WM.state.music.progress + '%';
      } else if (app === 'tasks' || app === 'messages' || app === 'settings') {
        root.scrollTop = Math.max(0, root.scrollTop - delta * 2.4);
      } else if (app === 'home') {
        if (Math.abs(delta) > 18) {
          const dir = delta > 0 ? 1 : -1;
          const newPage = Math.max(0, Math.min(homePages.length - 1, homePage + dir));
          if (newPage !== homePage) {
            homePage = newPage;
            renderHome(root);
            if (WM.playDetent) WM.playDetent();
          }
        }
      }
      saveState();
    }

    // ==================== SIDE BUTTON ====================
    let sideButtonCtrl = null;

    function initSideButton() {
      const pusher = document.getElementById('side-pusher');
      if (!pusher) return;

      sideButtonCtrl = Core.createSideButtonController({
        longMs: 620,
        onLongPress() {
          showAppSwitcher();
        },
        onShortPress() {
          if (WM.state.currentApp !== 'home') {
            navigate('home');
          } else {
            const screen = document.getElementById('screen');
            if (!screen) return;
            screen.style.transition = 'transform 120ms';
            screen.style.transform = 'scale(0.985)';
            setTimeout(() => { screen.style.transform = 'scale(1)'; }, 180);
          }
        }
      });

      pusher.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        sideButtonCtrl.pointerDown();
        pusher.style.transform = 'translateY(-50%) translateX(-1px)';
      });
      pusher.addEventListener('pointerup', () => {
        pusher.style.transform = 'translateY(-50%)';
        sideButtonCtrl.pointerUp();
      });
      pusher.addEventListener('pointerleave', () => {
        pusher.style.transform = 'translateY(-50%)';
        sideButtonCtrl.pointerLeave();
      });
      pusher.addEventListener('pointercancel', () => {
        pusher.style.transform = 'translateY(-50%)';
        sideButtonCtrl.pointerLeave();
      });
    }

    function showAppSwitcher() {
      const root = document.getElementById('screen-root');
      if (!root) return;
      const apps = Object.keys(Apps);
      root.dataset.app = 'switcher';
      root.innerHTML = `
        <div class="p-3 h-full overflow-auto" style="background:var(--wm-bg)">
          <div class="text-sm uppercase tracking-widest px-1 mb-2" style="color:var(--wm-ink-soft)">APP SWITCHER</div>
          <div class="grid grid-cols-4 gap-2">
            ${apps.map(name => `
              <div onclick="navigate('${name}');" 
                   class="aspect-square flex flex-col items-center justify-center rounded-2xl cursor-pointer text-center p-1.5"
                   style="background:var(--wm-surface-2);border:1px solid var(--wm-border)">
                <i class="fa-solid ${Apps[name].icon} text-lg mb-1 wm-purple"></i>
                <div class="text-[9px] leading-none" style="color:var(--wm-ink-soft)">${name}</div>
              </div>
            `).join('')}
          </div>
          <div class="text-center mt-4">
            <button onclick="navigate('home')" class="text-sm px-4 py-1 rounded-full" style="background:var(--wm-surface-2);color:var(--wm-ink)">Close</button>
          </div>
        </div>`;
    }

    // ==================== APP DEFINITIONS ====================
    const formatTime = (sec) => Core.formatTime(sec);

    let homePage = 0;
    const homePages = Core.HOME_PAGES;

    function renderHome(root) {
      const timeStr = `${String(WM.state.time.h).padStart(2,'0')}:${String(WM.state.time.m).padStart(2,'0')}`;
      const appsOnPage = homePages[homePage] || [];
      const totalPages = homePages.length;

      root.innerHTML = `
        <div class="h-full flex flex-col relative" style="padding-top: 28px; background:var(--wm-bg);">
          <div class="status-bar px-3 text-sm" style="position:absolute;top:0;left:0;right:0;z-index:40">
            <div style="color:var(--wm-ink)">${timeStr}</div>
            <div class="flex items-center gap-1" style="color:var(--wm-ink-soft)"><i class="fa-solid fa-battery-three-quarters"></i> ${WM.state.battery}%</div>
          </div>

          <div class="screen-content flex-1 flex flex-col">
            <div class="text-center pt-2 pb-3">
              <div class="text-6xl font-semibold tracking-tighter display-font" style="color:var(--wm-ink)">${timeStr}</div>
              <div class="text-sm" style="color:var(--wm-ink-soft); margin-top:-2px">Monday, 3 Feb</div>
            </div>

            <div class="app-grid flex-1" id="home-grid">
              ${appsOnPage.map(n => `
                <div onclick="navigate('${n}')" class="app-icon">
                  <i class="fa-solid ${Apps[n] ? Apps[n].icon : 'fa-square'}"></i>
                  <span>${n}</span>
                </div>
              `).join('')}
            </div>

            <div class="mt-1 flex justify-around items-center rounded-2xl py-1.5 px-2" style="background:var(--wm-surface-2);border:1px solid var(--wm-border)">
              <div onclick="navigate('clock')" class="text-center px-3 py-0.5 cursor-pointer"><i class="fa-solid fa-clock text-lg" style="color:var(--wm-ink)"></i></div>
              <div onclick="navigate('messages')" class="text-center px-3 py-0.5 cursor-pointer"><i class="fa-solid fa-comments text-lg" style="color:var(--wm-ink)"></i></div>
              <div onclick="navigate('health')" class="text-center px-3 py-0.5 cursor-pointer"><i class="fa-solid fa-heart-pulse text-lg" style="color:var(--wm-ink)"></i></div>
              <div onclick="navigate('timer')" class="text-center px-3 py-0.5 cursor-pointer"><i class="fa-solid fa-hourglass-half text-lg" style="color:var(--wm-ink)"></i></div>
            </div>
          </div>

          <div class="page-dots">
            ${Array.from({length: totalPages}).map((_, i) =>

    function bootWatch() {
      loadState();
      applyThemeToDom(WM.state.theme);

      // Optional crystal reflection — only if hardware chrome exists (legacy-safe)
      const crystal = document.getElementById('crystal');
      const refl = document.getElementById('reflection');
      if (crystal && refl) {
        crystal.addEventListener('mousemove', (e) => {
          const r = crystal.getBoundingClientRect();
          const x = ((e.clientX - r.left) / r.width) * 100;
          const y = ((e.clientY - r.top) / r.height) * 100;
          refl.style.background = `radial-gradient(circle at ${x}% ${y}%, rgba(255,255,255,0.38) 3%, transparent 26%, transparent 58%, rgba(255,255,255,0.05) 76%)`;
        });
        crystal.addEventListener('mouseleave', () => {
          refl.style.background = `linear-gradient(135deg, rgba(255,255,255,0.32) 4%, transparent 22%, transparent 52%, rgba(255,255,255,0.06) 72%, transparent 88%)`;
        });
      }

      initCrown();
      initSideButton();

      updateTime();
      setInterval(updateTime, 30000);

      setTimeout(() => {
        navigate(WM.state.currentApp || 'home');
        showToast('Watch Me OS ready — crown is live');
      }, 180);

      window.WM.test = {
        crown: (d = 80) => applyCrownEffect(d),
        navigate: (a) => navigate(a),
        notify: postDemoNotification,
        persist: () => { saveState(); return 'saved'; },
        reset: resetAll,
        state: () => WM.state,
        core: Core,
        sideButton: () => sideButtonCtrl,
        setPreset: (s) => setTimerPreset(s),
        toggleTimer: () => toggleTimer(),
        resetTimer: () => resetTimer(),
        sendMessage: (t) => {
          Core.sendMessage(WM.state, t);
          saveState();
          return WM.state.messages[WM.state.messages.length - 1];
        },
        nfc: () => { simulateNFC(); return WM.state.wallet.balance; },
        confirm: () => {
          Core.confirmTransaction(WM.state);
          saveState();
          return WM.state.wallet.balance;
        }
      };

      document.addEventListener('keydown', (e) => {
        if (Core.isTypingTarget(document.activeElement)) return;
        if (e.key === '/' ) {
          e.preventDefault();
          navigate('messages');
        }
        if (e.key.toLowerCase() === 'h') navigate('home');
      });

      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        WM.audio = new AudioCtx();
        WM.playDetent = () => {
          if (!WM.state.prefs?.haptics) return;
          const o = WM.audio.createOscillator();
          const g = WM.audio.createGain();
          o.type = 'sine'; o.frequency.value = 820;
          g.gain.value = 0.035;
          const f = WM.audio.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400;
          o.connect(f); f.connect(g); g.connect(WM.audio.destination);
          o.start();
          setTimeout(() => { g.gain.linearRampToValueAtTime(0.0001, WM.audio.currentTime + 0.06); o.stop(WM.audio.currentTime + 0.08); }, 12);
        };
      } catch (_) { WM.playDetent = () => {}; }

      const harness = document.createElement('div');
      harness.className = 'dev-harness';
      harness.innerHTML = `
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
          <strong style="color:var(--wm-magenta)">WM TEST</strong>
          <button onclick="WM.test.crown(90)">Crown +90</button>
          <button onclick="WM.test.navigate('timer')">Timer</button>
          <button onclick="WM.test.navigate('health')">Health</button>
          <button onclick="WM.test.notify()">Notify</button>
          <button onclick="WM.test.persist()">Persist</button>
          <button onclick="WM.test.reset()">Reset</button>
          <span style="margin-left:auto;opacity:.6">drag crown • long side-btn</span>
        </div>`;
      const container = document.getElementById('watch-container');
      if (container && container.parentNode) container.parentNode.insertBefore(harness, container.nextSibling);

      console.log('%c[Watch Me OS] Boot complete. Core helpers + square hardware ready.', 'color:#ff3d8b');
    }

    function resetAll() {
      localStorage.removeItem(Core.STORAGE_KEY);
      location.reload();
    }

    window.onload = bootWatch;
  </script>
</body>
</html>
