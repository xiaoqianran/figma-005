<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Me OS • Square Edition • The Instrument</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
    
    :root {
      /* Figma design system - FULL LIGHT THEME for watch screen UI (per user request) */
      --wm-bg: #ffffff;                    /* Figma canvas - white */
      --wm-surface: #ffffff;               /* Figma canvas */
      --wm-surface-2: #f7f7f5;             /* Figma surface-soft */
      --wm-ink: #000000;                   /* Figma ink - black */
      --wm-ink-soft: #5f6166;              /* Figma secondary */
      --wm-border: #e6e6e6;                /* Figma hairline */

      /* Figma pastel color blocks as accents */
      --wm-magenta: #ff3d8b;               /* accent-magenta */
      --wm-lime: #dceeb1;
      --wm-lilac: #c5b0f4;
      --wm-purple: #c5b0f4;                /* lilac as the purple-ish accent for legacy wm-purple */
      --wm-mint: #c8e6cd;
      --wm-cream: #f4ecd6;
      --wm-pink: #efd4d4;
      --wm-coral: #f3c9b6;
      --wm-navy: #1f1d3d;                  /* for dark text on light or inverse elements */

      /* Watch hardware heritage accents (minimal) */
      --wm-gold: #c5a26f;
    }

    body { font-family: 'Inter', system-ui, sans-serif; background: #f4f4f6; } /* Figma light canvas */
    .display-font { font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 600; letter-spacing: -0.04em; }

    /* ==================== SQUARE SMARTWATCH HARDWARE (modern rectangular form to match UI modules) ==================== */
    .watch-container {
      width: 360px;
      height: 420px;
      position: relative;
      filter: drop-shadow(0 60px 140px rgba(0,0,0,0.9));
    }
    .watch-case {
      width: 100%;
      height: 100%;
      border-radius: 56px; /* large rounded square - modern square smartwatch */
      background: linear-gradient(145deg, #2a2a2e 0%, #161618 35%, #0c0c0e 70%, #1f1f22 100%);
      box-shadow: 
        inset 0 0 0 14px #0a0a0c,
        inset 60px 60px 100px rgba(0,0,0,0.7),
        inset -30px -30px 80px rgba(255,255,255,0.035),
        0 0 0 1px #3a3a40,
        0 50px 120px rgba(0,0,0,0.7);
      position: relative;
      overflow: hidden;
    }
    .watch-bezel {
      position: absolute;
      inset: 14px;
      border-radius: 46px;
      background: #121214;
      box-shadow: inset 0 0 0 2px #29292e, inset 0 20px 60px rgba(0,0,0,0.85);
    }
    .watch-crystal {
      position: absolute;
      inset: 26px;
      border-radius: 38px;
      background: #0a0b0d;
      box-shadow: 
        inset 0 0 0 1px rgba(255,255,255,0.12),
        inset 0 22px 70px rgba(0,0,0,0.92),
        inset 0 -10px 40px rgba(255,255,255,0.025),
        0 0 0 1px rgba(197,162,111,0.1);
      overflow: hidden;
      z-index: 10;
    }
    .crystal-reflection {
      position: absolute;
      inset: 0;
      border-radius: 38px;
      background: linear-gradient(135deg, rgba(255,255,255,0.32) 4%, transparent 22%, transparent 52%, rgba(255,255,255,0.06) 72%, transparent 88%);
      mix-blend-mode: screen;
      z-index: 20;
      pointer-events: none;
      transition: background 60ms linear;
    }
    .watch-screen {
      position: absolute;
      inset: 32px;
      width: 296px;
      height: 356px; /* rectangular screen */
      border-radius: 32px;
      background: var(--wm-bg); /* Figma white canvas */
      box-shadow: inset 0 0 0 1px var(--wm-border);
      overflow: hidden;
      z-index: 30;
      color: var(--wm-ink); /* black text */
    }
    /* Digital Crown - right side vertical for square watch (inspired by modern square smartwatch best practices) */
    .crown {
      position: absolute;
      right: -14px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 72px;
      background: linear-gradient(90deg, #2f2f33, #1a1a1d 35%, #2f2f33);
      border-radius: 12px;
      box-shadow: 4px 0 10px rgba(0,0,0,0.65), inset -1px 0 5px rgba(255,255,255,0.12);
      cursor: ns-resize;
      z-index: 50;
      border: 1px solid #3a3a40;
    }
    .crown::before {
      content: '';
      position: absolute;
      left: -5px;
      top: 50%;
      transform: translateY(-50%);
      width: 6px;
      height: 14px;
      background: #1a1a1d;
      border-radius: 2px;
      box-shadow: inset 0 0 0 1px #3a3a40;
    }
    .crown::after {
      content: '';
      position: absolute;
      inset: 10px 3px;
      background: repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.3) 2px, rgba(0,0,0,0.3) 5px);
      border-radius: 8px;
    }

    /* Subtle side pusher (left edge) - for square form factor */
    .side-pusher {
      position: absolute;
      left: -4px;
      top: 50%;
      transform: translateY(-50%);
      width: 6px;
      height: 28px;
      background: linear-gradient(#2a2a2e, #1a1a1d);
      border-radius: 3px;
      box-shadow: -2px 0 4px rgba(0,0,0,0.5);
      z-index: 49;
      border: 1px solid #3a3a40;
    }

    /* Screen Content */
    .screen { width: 100%; height: 100%; position: relative; overflow: hidden; }
    .status-bar {
      height: 28px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between;
      font-size: 10px; font-weight: 600; letter-spacing: 0.5px; 
      background: var(--wm-surface-2); /* light Figma surface */
      border-bottom: 1px solid var(--wm-border);
      position: relative; z-index: 40;
      color: var(--wm-ink-soft);
    }
    /* Better safe area + multi-page home like real smartwatches */
    .screen-content {
      padding-top: 28px; /* below status bar */
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: 18px;
      height: 100%;
      box-sizing: border-box;
    }
    .app-grid { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 14px; 
      padding: 8px 4px;
    }
    .app-icon {
      aspect-ratio: 1; 
      border-radius: 20px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      background: var(--wm-surface-2); /* Figma light surface-soft */
      border: 1px solid var(--wm-border);
      transition: all 0.1s cubic-bezier(0.23,1,0.32,1); 
      cursor: pointer; 
      font-size: 12px; 
      gap: 5px;
      min-height: 72px;
      color: var(--wm-ink);
    }
    .app-icon:hover { background: #f1f1f3; border-color: #d1d1d1; }
    .app-icon:active { transform: scale(0.93); }
    .app-icon .fa { font-size: 22px; margin-bottom: 2px; color: var(--wm-magenta); }
    .app-icon span { font-size: 10px; opacity: 0.85; color: var(--wm-ink); }

    /* Simple page indicator */
    .page-dots {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
    }
    .page-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--wm-border);
    }
    .page-dot.active { background: var(--wm-magenta); }

    /* App Styles */
    .app-header { 
      padding: 12px 16px 8px; 
      font-weight: 600; 
      font-size: 13px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      color: var(--wm-ink);
      border-bottom: 1px solid var(--wm-border);
    }
    .list-item {
      padding: 11px 16px; 
      margin: 3px 10px; 
      border-radius: 14px; 
      display: flex; 
      align-items: center; 
      gap: 12px;
      background: #ffffff; 
      border: 1px solid var(--wm-border);
      transition: all 0.1s; 
      min-height: 44px;
      color: var(--wm-ink);
    }
    .list-item:hover { background: var(--wm-surface-2); }
    .list-item:active { background: #f1f1f3; transform: scale(0.985); }
    .lux-button {
      background: #000000; color: #ffffff; font-weight: 600; font-size: 12px;
      padding: 8px 18px; border-radius: 9999px; transition: all 0.1s; /* Figma black primary pill */
    }
    .lux-button:active { transform: scale(0.96); }
    .lux-button.secondary { background: #ffffff; color: #000000; border: 1px solid #000000; } /* Figma white secondary */

    .ring { transition: stroke-dashoffset 400ms cubic-bezier(0.23,1,0.32,1); }
    .wm-gold { color: var(--wm-gold); }
    .wm-purple { color: var(--wm-purple); }

    .toast {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: #ffffff; color: #000000; font-size: 11px; padding: 6px 14px; border-radius: 9999px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid #e6e6e6;
      opacity: 0; transition: all 0.2s; pointer-events: none;
      white-space: nowrap; z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

    .crown-active { box-shadow: 0 0 0 3px rgba(197,162,111,0.3); }

    /* Visible dev harness - light Figma style */
    .dev-harness {
      margin-top: 12px; background: #ffffff; border: 1px solid #e6e6e6; border-radius: 12px;
      font-size: 10px; padding: 8px 10px; color: #5f6166; width: 380px;
    }
    .dev-harness button {
      font-size: 9px; padding: 2px 8px; background: #f7f7f5; border: 1px solid #e6e6e6; border-radius: 6px; margin: 2px; color: #000;
    }
    .dev-harness button:hover { background: #ff3d8b; color: #fff; border-color: #ff3d8b; }
  </style>
</head>
<body class="bg-[#f4f4f6] flex items-center justify-center min-h-screen p-8">
  <div class="flex flex-col items-center">
    <!-- Header -->
    <div class="mb-4 flex items-center gap-3 text-sm">
      <div class="flex items-center gap-2">
        <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
        <span class="text-[#5f6166] font-medium tracking-[1px] text-xs">WATCH ME OS v1.0</span>
      </div>
      <div class="h-3 w-px bg-[#e6e6e6]"></div>
      <div class="px-2 py-0.5 text-[10px] rounded bg-[#dceeb1] text-[#000] font-mono tracking-wider">SQUARE</div>
      <button onclick="resetAll()" 
              class="text-[#5f6166] hover:text-black text-xs flex items-center gap-1.5 transition-colors">
        <i class="fa-solid fa-undo text-[10px]"></i> RESET STATE
      </button>
      <button onclick="cycleTheme()" 
              class="px-3 py-1 rounded-full bg-[#f7f7f5] hover:bg-[#f1f1f3] text-xs flex items-center gap-1.5 transition-all" style="color:#000">
        <i class="fa-solid fa-palette"></i> <span id="theme-label">LIGHT</span>
      </button>
    </div>

    <!-- THE WATCH - Square/rectangular modern smartwatch (matches rectangular UI modules) -->
    <div class="watch-container" id="watch-container">
      <div class="watch-case" id="watch-case">
        <!-- Bezel -->
        <div class="watch-bezel"></div>
        
        <!-- Crystal + Screen (rectangular for square watch hardware) -->
        <div class="watch-crystal" id="crystal">
          <div class="crystal-reflection" id="reflection"></div>
          
          <!-- Rectangular screen - designed to host the 184x224 style modules naturally -->
          <div class="watch-screen" id="screen">
            <div id="screen-root" class="screen"></div>
          </div>
        </div>

        <!-- Digital Crown (right side vertical) -->
        <div class="crown" id="crown" title="Digital Crown — drag vertically"></div>
        
        <!-- Subtle side pusher (left edge) -->
        <div class="side-pusher" id="side-pusher"></div>
      </div>
    </div>

    <!-- Meta controls -->
    <div class="mt-5 flex gap-2 text-xs">
      <div onclick="navigate('home')" class="px-4 py-1.5 rounded-2xl bg-[#f7f7f5] hover:bg-[#f1f1f3] cursor-pointer flex items-center gap-2" style="color:#000">
        <i class="fa-solid fa-home"></i> <span>Home</span>
      </div>
      <div onclick="showAppSwitcher()" class="px-4 py-1.5 rounded-2xl bg-[#f7f7f5] hover:bg-[#f1f1f3] cursor-pointer flex items-center gap-2" style="color:#000">
        <i class="fa-solid fa-layer-group"></i> <span>Switcher</span>
      </div>
      <div onclick="postDemoNotification()" class="px-4 py-1.5 rounded-2xl bg-[#f7f7f5] hover:bg-[#f1f1f3] cursor-pointer flex items-center gap-2" style="color:#000">
        <i class="fa-solid fa-bell"></i> <span>Notify</span>
      </div>
    </div>

    <div class="mt-3 text-[10px] text-[#5f6166] tracking-widest">DRAG CROWN • TAP ICONS • LONG-PRESS BUTTON</div>
  </div>

  <!-- Toast container -->
  <div id="toast" class="toast"></div>

  <script>
    // ==================== WATCH ME OS — CORE ====================
    const WM = window.WM = {
      version: '1.0.0-redesign',
      state: {
        currentApp: 'home',
        theme: 'dark',
        battery: 87,
        time: { h: 9, m: 41 },
        notifications: [],
        tasks: [
          { id: 1, text: 'Drink 2 liters of water', done: false, due: 'Today' },
          { id: 2, text: 'Call grandma at 8 AM', done: true, due: 'Today' },
          { id: 3, text: 'Finish quarterly report', done: false, due: 'Tomorrow' }
        ],
        messages: [
          { id: 1, from: 'Sarah Chen', text: 'Dinner at 7?', time: '09:12', me: false },
          { id: 2, from: 'You', text: 'Perfect, see you then', time: '09:14', me: true }
        ],
        timer: { remaining: 0, running: false, preset: 300 },
        health: { steps: 7420, move: 68, exercise: 41, stand: 12 },
        music: { playing: false, track: 'Nocturne in C#', progress: 42, volume: 70 },
        wallet: { balance: 2847.50, cards: 2 }
      },
      history: [],
      crownValue: 0,
      crownMomentum: 0
    };

    // Persistence
    function loadState() {
      try {
        const saved = localStorage.getItem('wm_state_v1');
        if (saved) Object.assign(WM.state, JSON.parse(saved));
        if (!WM.state.prefs) WM.state.prefs = { haptics: true, reduceMotion: false };
      } catch (e) {}
    }
    function saveState() {
      localStorage.setItem('wm_state_v1', JSON.stringify(WM.state));
    }

    // Utilities
    function showToast(msg, ms = 1600) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), ms);
    }

    function updateTime() {
      const now = new Date();
      WM.state.time.h = now.getHours();
      WM.state.time.m = now.getMinutes();
      // Update any visible clocks
      const clocks = document.querySelectorAll('[data-live-time]');
      clocks.forEach(el => {
        el.textContent = `${String(WM.state.time.h).padStart(2,'0')}:${String(WM.state.time.m).padStart(2,'0')}`;
      });
    }

    function cycleTheme() {
      const themes = ['dark', 'light', 'gold'];
      const idx = (themes.indexOf(WM.state.theme) + 1) % 3;
      WM.state.theme = themes[idx];
      document.documentElement.setAttribute('data-theme', WM.state.theme === 'dark' ? '' : WM.state.theme);
      document.getElementById('theme-label').textContent = WM.state.theme.toUpperCase();
      if (!WM.state.prefs) WM.state.prefs = { haptics: true, reduceMotion: false };
      saveState();
      // Re-render current app so colors update
      if (WM.state.currentApp) renderApp(WM.state.currentApp);
    }

    // ==================== RENDER REGISTRY ====================
    const Apps = {};

    function registerApp(name, renderFn, icon = 'fa-square') {
      Apps[name] = { render: renderFn, icon };
    }

    function navigate(app, props = {}) {
      WM.state.currentApp = app;
      WM.history.push(app);
      if (WM.history.length > 6) WM.history.shift();
      renderApp(app, props);
      saveState();
    }

    function renderApp(name, props = {}) {
      const root = document.getElementById('screen-root');
      if (!root) return;
      root.innerHTML = '';
      root.dataset.app = name;

      if (Apps[name]) {
        Apps[name].render(root, props);
      } else {
        root.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center p-6 text-center bg-[#ffffff]">
            <i class="fa-solid fa-rocket text-3xl mb-3 opacity-50" style="color:#5f6166"></i>
            <div class="font-semibold text-sm" style="color:#000">${name.toUpperCase()}</div>
            <div class="text-xs text-[#5f6166] mt-1">App coming in next OTA</div>
            <button onclick="navigate('home')" class="mt-6 lux-button text-xs px-5 py-1.5">Return Home</button>
          </div>`;
      }
      // Live time in status if present
      updateTime();
    }

    // ==================== CROWN PHYSICS ====================
    let crownDragging = false;
    let crownLastY = 0;
    let crownLastTime = 0;

    function initCrown() {
      const crown = document.getElementById('crown');
      const screen = document.getElementById('screen');

      function onPointerDown(e) {
        crownDragging = true;
        crownLastY = e.clientY || (e.touches && e.touches[0].clientY);
        crownLastTime = Date.now();
        WM.crownMomentum = 0;
        crown.classList.add('crown-active');
        e.preventDefault();
      }
      function onPointerMove(e) {
        if (!crownDragging) return;
        const y = e.clientY || (e.touches && e.touches[0].clientY);
        const delta = (y - crownLastY) * -1.2; // invert for natural feel
        WM.crownValue += delta;
        WM.crownMomentum = delta * 0.6;

        crownLastY = y;
        const now = Date.now();
        if (now - crownLastTime > 40) {
          applyCrownEffect(delta);
          crownLastTime = now;
        }
      }
      function onPointerUp() {
        if (!crownDragging) return;
        crownDragging = false;
        crown.classList.remove('crown-active');
        // Apply momentum decay
        if (Math.abs(WM.crownMomentum) > 0.8) {
          const decay = setInterval(() => {
            WM.crownMomentum *= 0.86;
            if (Math.abs(WM.crownMomentum) < 0.6) { clearInterval(decay); return; }
            applyCrownEffect(WM.crownMomentum);
          }, 32);
        }
      }

      crown.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      // Touch
      crown.addEventListener('touchstart', onPointerDown, {passive:false});
      window.addEventListener('touchmove', onPointerMove, {passive:false});
      window.addEventListener('touchend', onPointerUp);
    }

    function applyCrownEffect(delta) {
      const root = document.getElementById('screen-root');
      if (!root) return;
      const app = root.dataset.app;

      // Trigger luxury detent click on meaningful movement
      if (Math.abs(delta) > 2.5 && WM.playDetent) WM.playDetent();

      // Global crown behaviors
      if (app === 'timer') {
        const timerEl = root.querySelector('#timer-display');
        if (timerEl && WM.state.timer.running) {
          WM.state.timer.remaining = Math.max(0, WM.state.timer.remaining + Math.round(delta * 1.8));
          timerEl.textContent = formatTime(WM.state.timer.remaining);
        }
      } else if (app === 'music') {
        WM.state.music.progress = Math.max(0, Math.min(100, WM.state.music.progress + delta * 0.6));
        const bar = root.querySelector('#music-progress');
        if (bar) bar.style.width = WM.state.music.progress + '%';
      } else if (app === 'tasks' || app === 'messages' || app === 'settings') {
        // Scroll simulation
        root.scrollTop = Math.max(0, root.scrollTop - delta * 2.4);
      } else if (app === 'home') {
        // Real smartwatch behavior: crown on Home switches pages
        if (Math.abs(delta) > 18) {
          const dir = delta > 0 ? 1 : -1;
          const newPage = Math.max(0, Math.min(homePages.length - 1, homePage + dir));
          if (newPage !== homePage) {
            homePage = newPage;
            renderHome(root);
            if (WM.playDetent) WM.playDetent();
          }
        }
      }
      saveState();
    }

    // ==================== SIDE BUTTON ====================
    function initSideButton() {
      // Subtle pusher at 9 o'clock - short press = home, long press = app switcher (same behavior, less visually prominent)
      const pusher = document.getElementById('side-pusher');
      if (!pusher) return;
      let pressTimer = null;

      pusher.addEventListener('pointerdown', () => {
        pressTimer = setTimeout(() => {
          showAppSwitcher();
        }, 620);
        pusher.style.transform = 'translateY(-50%) translateX(-1px)';
      });
      pusher.addEventListener('pointerup', () => {
        pusher.style.transform = 'translateY(-50%)';
        if (pressTimer) {
          clearTimeout(pressTimer);
          if (WM.state.currentApp !== 'home') {
            navigate('home');
          } else {
            const screen = document.getElementById('screen');
            screen.style.transition = 'transform 120ms';
            screen.style.transform = 'scale(0.985)';
            setTimeout(() => { screen.style.transform = 'scale(1)'; }, 180);
          }
        }
      });
      pusher.addEventListener('pointerleave', () => {
        pusher.style.transform = 'translateY(-50%)';
        clearTimeout(pressTimer);
      });
    }

    function showAppSwitcher() {
      const root = document.getElementById('screen-root');
      const apps = Object.keys(Apps);
      root.innerHTML = `
        <div class="p-3 h-full overflow-auto bg-[#ffffff]">
          <div class="text-xs uppercase tracking-widest text-[#5f6166] px-1 mb-2">APP SWITCHER</div>
          <div class="grid grid-cols-4 gap-2">
            ${apps.map(name => `
              <div onclick="navigate('${name}');" 
                   class="aspect-square flex flex-col items-center justify-center rounded-2xl bg-[#f7f7f5] hover:bg-[#f1f1f3] active:bg-[#e6e6e6] cursor-pointer text-center p-1.5">
                <i class="fa-solid ${Apps[name].icon} text-lg mb-1 wm-purple"></i>
                <div class="text-[9px] leading-none" style="color:#5f6166">${name}</div>
              </div>
            `).join('')}
          </div>
          <div class="text-center mt-4">
            <button onclick="navigate('home')" class="text-xs px-4 py-1 rounded-full bg-[#f7f7f5]" style="color:#000">Close</button>
          </div>
        </div>`;
    }

    // ==================== APP DEFINITIONS ====================
    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    // HOME - Multi-page like real smartwatches (not cramming everything on one screen)
    let homePage = 0;
    const homePages = [
      // Page 0 - Primary / Frequent
      ['clock', 'timer', 'health', 'messages', 'tasks', 'wallet', 'music', 'activity'],

    function bootWatch() {
      loadState();
      
      // Initial theme
      const th = WM.state.theme || 'dark';
      if (th !== 'dark') document.documentElement.setAttribute('data-theme', th);
      document.getElementById('theme-label').textContent = th.toUpperCase();

      // Crystal reflection mouse follow
      const crystal = document.getElementById('crystal');
      const refl = document.getElementById('reflection');
      crystal.addEventListener('mousemove', (e) => {
        const r = crystal.getBoundingClientRect();
        const x = ((e.clientX - r.left) / r.width) * 100;
        const y = ((e.clientY - r.top) / r.height) * 100;
        refl.style.background = `radial-gradient(circle at ${x}% ${y}%, rgba(255,255,255,0.38) 3%, transparent 26%, transparent 58%, rgba(255,255,255,0.05) 76%)`;
      });
      crystal.addEventListener('mouseleave', () => {
        refl.style.background = `linear-gradient(135deg, rgba(255,255,255,0.32) 4%, transparent 22%, transparent 52%, rgba(255,255,255,0.06) 72%, transparent 88%)`;
      });

      initCrown();
      initSideButton();

      // Boot to home or last app
      updateTime();
      setInterval(updateTime, 30000); // every 30s

      // Start on home
      setTimeout(() => {
        navigate(WM.state.currentApp || 'home');
        showToast('Watch Me OS ready — crown is live');
      }, 180);

      // Expose powerful test API (enhanced with gyro + detent from parallel agent)
      window.WM.test = {
        crown: (d = 80) => applyCrownEffect(d),
        navigate: (a) => navigate(a),
        notify: postDemoNotification,
        persist: () => { saveState(); return 'saved'; },
        reset: resetAll,
        state: () => WM.state,
        enableGyro: () => {
          if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (ev) => {
              if (ev.gamma) applyCrownEffect(ev.gamma * 0.8);
            }, { once: true });
            alert('Gyro enabled — tilt device to drive crown (permission may be required on iOS)');
          }
        }
      };

      // Keyboard support
      document.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement.tagName === 'BODY') {
          e.preventDefault();
          navigate('messages');
        }
        if (e.key.toLowerCase() === 'h') navigate('home');
      });

      // Luxury crown detent audio (from parallel agent best practice)
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        WM.audio = new AudioCtx();
        WM.playDetent = () => {
          if (!WM.state.prefs?.haptics) return;
          const o = WM.audio.createOscillator();
          const g = WM.audio.createGain();
          o.type = 'sine'; o.frequency.value = 820;
          g.gain.value = 0.035;
          const f = WM.audio.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400;
          o.connect(f); f.connect(g); g.connect(WM.audio.destination);
          o.start();
          setTimeout(() => { g.gain.linearRampToValueAtTime(0.0001, WM.audio.currentTime + 0.06); o.stop(WM.audio.currentTime + 0.08); }, 12);
        };
      } catch (_) { WM.playDetent = () => {}; }

      // Visible dev harness (expanded)
      const harness = document.createElement('div');
      harness.className = 'dev-harness';
      harness.innerHTML = `
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
          <strong style="color:#ff3d8b">WM TEST</strong>
          <button onclick="WM.test.crown(90)">Crown +90</button>
          <button onclick="WM.test.navigate('timer')">Timer</button>
          <button onclick="WM.test.navigate('health')">Health</button>
          <button onclick="WM.test.notify()">Notify</button>
          <button onclick="WM.test.persist()">Persist</button>
          <button onclick="WM.test.reset()">Reset</button>
          <span style="margin-left:auto;opacity:.6">drag crown • long side-btn</span>
        </div>`;
      const container = document.getElementById('watch-container');
      if (container) container.parentNode.insertBefore(harness, container.nextSibling);

      console.log('%c[Watch Me OS] Boot complete. Figma colors + square hardware ready.', 'color:#ff3d8b');
    }

    function resetAll() {
      localStorage.removeItem('wm_state_v1');
      location.reload();
    }

    // Register a few more for switcher completeness
    registerApp('activity', (r) => { r.innerHTML = `<div class="p-4 text-xs bg-[#ffffff] h-full" style="color:#000">Activity rings live in Health app. <span onclick="navigate('health')" class="underline cursor-pointer" style="color:#ff3d8b">Open Health →</span></div>`; }, 'fa-chart-line');
    registerApp('team', (r) => { r.innerHTML = `<div class="p-4 bg-[#ffffff] h-full"><div class="text-xs mb-2" style="color:#000">TEAM</div><div class="flex -space-x-2">${[ '#dceeb1','#c5b0f4','#c8e6cd','#f3c9b6' ].map(c=>`<div class="w-7 h-7 rounded-full" style="background:${c};border:1px solid #e6e6e6"></div>`).join('')}</div><div class="text-[10px] mt-2" style="color:#5f6166">4 members online</div></div>`; }, 'fa-users');
    registerApp('add-contact', (r) => { r.innerHTML = `<div class="p-4 text-xs bg-[#ffffff] h-full" style="color:#000">Add contact form stub. <button onclick="navigate('messages')" class="underline" style="color:#ff3d8b">Done</button></div>`; }, 'fa-user-plus');

    // Auto boot
    window.onload = bootWatch;
  </script>
</body>
</html>
