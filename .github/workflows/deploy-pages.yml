name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Required permissions for GitHub Pages deployment via Actions (official 2026 best practice)
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single job is acceptable for pure static sites with no build step.
  # For projects with build steps, split into separate "build" and "deploy" jobs.
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # Attempt to auto-enable Pages + set source to GitHub Actions if not already configured.
          # Note: Manual setup in Settings → Pages is still the most reliable method.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Deploy the entire repository root as static content
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

