<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面复刻模板 - GODY</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", SimHei, Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 手机容器 - 固定 375x812 模拟 iPhone */
        .phone-container {
            position: relative;
            background: #ffffff;
            width: 375px;
            height: 812px;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
        }

        /* 状态栏 */
        .status-bar {
            width: 100%;
            height: 40px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            z-index: 100;
        }

        .status-bar-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0 20px;
        }

        .time {
            font-size: 14px;
            font-weight: 600;
            color: #000000;
            letter-spacing: -0.3px;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
        }

        /* 内容区域 */
        .content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* 底部安全区域（Home Indicator 预留） */
        .home-indicator {
            height: 34px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .home-indicator-bar {
            width: 134px;
            height: 5px;
            background: #000000;
            border-radius: 3px;
            opacity: 0.2;
        }

        /* ==================== 复刻专用辅助类（根据 Figma 调整）==================== */
        .section {
            padding: 0 24px;
        }

        .text-primary {
            color: #333333;
        }

        .text-secondary {
            color: #666666;
        }

        .text-hint {
            color: #999999;
        }

        .divider {
            height: 1px;
            background: #eeeeee;
            margin: 0;
        }

        /* 占位样式 - 实际复刻时删除或替换 */
        .placeholder {
            background: repeating-linear-gradient(
                45deg,
                #f0f0f0,
                #f0f0f0 10px,
                #e8e8e8 10px,
                #e8e8e8 20px
            );
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 13px;
            border: 1px dashed #ccc;
            min-height: 80px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <!-- 手机外壳 -->
    <div class="phone-container">
        <!-- 状态栏 -->
        <div class="status-bar">
            <div class="status-bar-content">
                <div class="time">9:41</div>
                <div class="status-icons">
                    <span>●●●●</span>
                    <span>Wi-Fi</span>
                    <span>100%</span>
                </div>
            </div>
        </div>

        <!-- 页面内容区域 -->
        <div class="content">
            <!--
                TODO: 在此区域按 Figma 设计稿逐步实现各模块
                建议拆分阶段：
                1. 顶部导航 / Header（返回、标题、操作按钮）
                2. 主要视觉区（插画、Banner、地图等）
                3. 表单 / 输入区
                4. 列表 / 卡片内容
                5. 底部固定操作栏（按钮、Tab 等）
            -->

            <div class="section" style="padding-top: 40px; text-align: center;">
                <h1 style="font-size: 22px; font-weight: 600; color: #333;">页面复刻模板</h1>
                <p style="margin-top: 8px; color: #888; font-size: 14px;">
                    375 × 812 • iPhone 风格容器
                </p>
            </div>

            <!-- 占位区块 - 实际复刻时替换为真实内容 -->
            <div class="section" style="margin-top: 40px;">
                <div class="placeholder">
                    [ Header / 欢迎区 ]
                </div>
            </div>

            <div class="section" style="margin-top: 20px;">
                <div class="placeholder">
                    [ 主要内容区域 - 表单 / 列表 / 地图 等 ]
                </div>
            </div>

            <div class="section" style="margin-top: 20px;">
                <div class="placeholder" style="min-height: 160px;">
                    [ 底部卡片 / 推荐内容 ]
                </div>
            </div>
        </div>

        <!-- 底部 Home Indicator -->
        <div class="home-indicator">
            <div class="home-indicator-bar"></div>
        </div>
    </div>

    <!--
        可选：在此添加简单交互脚本
        <script>...</script>
    -->
</body>
</html>
