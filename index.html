<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Me UI Kit — Figma 复刻项目</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white">
  <div class="max-w-5xl mx-auto px-6 py-16">
    <h1 class="text-5xl font-bold tracking-tight">Watch Me UI Kit</h1>
    <p class="mt-4 text-xl text-zinc-400">基于 Figma Dark Theme 的高保真可交互 Web 原型</p>

    <div class="mt-12 grid md:grid-cols-2 lg:grid-cols-4 gap-6">
      <a href="prototypes/watch-me-interactive-prototype.html" 
         class="block p-8 bg-zinc-900 rounded-3xl hover:bg-zinc-800 transition-colors">
        <div class="font-semibold text-2xl">交互式原型</div>
        <div class="mt-2 text-zinc-400">完整的手表模拟器，包含 16 个可交互屏幕</div>
        <div class="mt-4 text-sm text-emerald-400">→ 立即体验</div>
      </a>

      <a href="components/dark-theme-cards-library.html" 
         class="block p-8 bg-zinc-900 rounded-3xl hover:bg-zinc-800 transition-colors">
        <div class="font-semibold text-2xl">组件库</div>
        <div class="mt-2 text-zinc-400">所有卡片的静态展示 + 一键复制 HTML</div>
        <div class="mt-4 text-sm text-emerald-400">→ 查看所有组件</div>
      </a>

      <a href="prototypes/watch-me-dark-perfect.html" 
         class="block p-8 bg-zinc-900 rounded-3xl hover:bg-zinc-800 transition-colors">
        <div class="font-semibold text-2xl">完美复刻</div>
        <div class="mt-2 text-zinc-400">手机外框 + 多场景卡片高保真呈现</div>
        <div class="mt-4 text-sm text-emerald-400">→ 查看复刻</div>
      </a>

      <a href="prototypes/watch-me-replica.html" 
         class="block p-8 bg-zinc-900 rounded-3xl hover:bg-zinc-800 transition-colors">
        <div class="font-semibold text-2xl">卡片展示</div>
        <div class="mt-2 text-zinc-400">核心卡片网格 + 设计令牌参考</div>
        <div class="mt-4 text-sm text-emerald-400">→ 打开预览</div>
      </a>
    </div>

    <div class="mt-16 text-sm text-zinc-500">
      本项目使用 figma-mcp-go 提取 Figma 节点数据进行高保真复刻。<br>
      目标：将设计稿转化为可直接用于项目的可交互组件。
    </div>
  </div>
